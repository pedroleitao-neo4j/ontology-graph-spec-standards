            "xsdAttribute": "date"
            "xsdType": "xsd:date xsd:dateTime"
            "attributeGroup": "date"
      "by":
        "type": "STRING"
        "name": "by"
        "description": "The attribute by is used to identify the agent of an action. It is a reference to a TLCPerson or TLCOrganization element in the references section. Resolved to the Agent it identifies by the by relationship."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_agent.html"
