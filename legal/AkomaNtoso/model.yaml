  "FRBRExpression":
    "labels":
      "identifier": "FRBRExpression"
      "implied":
        - "FRBRLevel"
    "description": "The element FRBRExpression is the metadata container of identifying properties related to the Expression level according to the FRBR hierarchy."
    "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_FRBRExpression.html"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the FRBRExpression: an IRI unique across documents. For a document, its expression IRI, e.g. /akn/ke/act/2010-08-27/1/eng@; for an element within a document, the document's IRI followed by # and the element's eId, or where it has none its wId, GUID or an identifier the loader assigns."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-nc/v1.0/os/akn-nc-v1.0-os.html"
      "frbrVersionNumber":
        "type": "STRING"
        "name": "frbrVersionNumber"
        "description": "The element FRBRversionNumber is the metadata property containing the value of the version number if appropriate to identify the specific expression here contained. It allows an arbitrary string."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_FRBRversionNumber.html"
        "extensions":
          "custom":
            "xsdElement": "FRBRversionNumber"
            "xsdAttribute": "value"
            "xsdType": "xsd:string"
            "lower": 0
            "upper": 1
      "frbrAuthoritative":
        "type": "BOOLEAN"
        "name": "frbrAuthoritative"
        "description": "The element FRBRauthoritative is the metadata property containing a boolean value to determine whether the document contains authoritative text (i.e., content that is the official, authoritative product of an official workflow from an entity that is entrusted with generating an official, authoriative version of the document."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_FRBRauthoritative.html"
        "extensions":
          "custom":
            "xsdElement": "FRBRauthoritative"
            "xsdAttribute": "value"
            "xsdType": "xsd:boolean"
            "lower": 0
            "upper": 1
      "frbrMasterExpression":
        "type": "STRING"
        "name": "frbrMasterExpression"
        "description": "The element FRBRmasterExpression is the metadata property identifying the master expression, i.e., the expression whose ids are used as permanent ids in the wId attributes. An expression without the FRBRmasterExpression element is considered a master expression itself, i.e., the first version, or the most important version, of a document expressed in the only language, or in the most important language. Any other situation (subsequent versions, or language variants, or content variants) must have the FRBRmasterExpression element pointing to the URI of the master expression. If the FRBRmasterEpression is specified, but without a href pointing to the masterExpression, it is assumed that NO master expression exist in reality, but an UR-Expression exist, whose ids are used in this expression as wIds."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_FRBRmasterExpression.html"
        "extensions":
          "custom":
            "xsdElement": "FRBRmasterExpression"
            "xsdAttribute": "href"
            "xsdType": "xsd:anyURI"
            "lower": 0
            "upper": 1
      "frbrLanguage":
        "type": "LIST<STRING>"
        "name": "frbrLanguage"
        "description": "The element FRBRlanguage is the metadata property containing a RFC4646 (three-letter code) of the main human language used in the content of this expression."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_FRBRlanguage.html"
        "extensions":
          "custom":
            "xsdElement": "FRBRlanguage"
            "xsdAttribute": "language"
            "xsdType": "language"
            "lower": 1
    "constraints":
