            "xsdAttribute": "href"
            "xsdType": "xsd:anyURI"
            "attributeGroup": "linkopt"
      "date":
        "type": "STRING"
        "name": "date"
        "description": "The attribute date is used to give a normalized value for a date according to the XSD syntax YYYY-MM-DD or a normalized value for a dateTime according to the XSD syntax YYYY-MM-DDThh:mm:ss(zzzz)."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_date.html"
        "extensions":
          "custom":
            "xsdAttribute": "date"
            "xsdType": "xsd:date xsd:dateTime"
            "attributeGroup": "date"
      "source":
        "type": "STRING"
        "name": "source"
        "description": "The attribute source links to the agent (person, organization) providing the specific annotation or markup. Resolved to the Agent it identifies by the source relationship."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_source.html"
        "extensions":
          "custom":
            "xsdAttribute": "source"
            "xsdType": "agentRef"
            "attributeGroup": "source"
      "refersTo":
        "type": "LIST<STRING>"
        "name": "refersTo"
        "description": "This attribute creates a connection between the element and an element of the Akoma Ntoso ontology to which it refers. In elements using this attribute definition the refersTo attribute is optional. Resolved to the RefItem it identifies by the refers to relationship."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_refers.html"
        "extensions":
          "custom":
            "xsdAttribute": "refersTo"
            "xsdType": "referenceRef"
            "attributeGroup": "refers"
      "type":
        "type": "STRING"
        "name": "type"
        "description": "The type of the EventRef. One of `generation`, `amendment` and `repeal`."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_eventType.html"
        "extensions":
          "custom":
            "xsdAttribute": "type"
            "xsdType": "eventType"
            "attributeGroup": "eventType"
        "one_of":
          - "generation"
          - "amendment"
          - "repeal"
      "originatingExpression":
        "type": "BOOLEAN"
        "name": "originatingExpression"
        "description": "The attribute originating is used to identify whether the event is the one originating this expression."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_originating.html"
        "extensions":
