            "xsdType": "roleRef"
            "attributeGroup": "role"
      "startTime":
        "type": "ZONED DATETIME"
        "name": "startTime"
        "description": "The attributes in speechAtts are used in speeches to identify agents and roles of speeches. In particular, attribute 'by' identifies the speaker, optional attribute 'as' identifies the role under which the speaker is speaking, optional attribute startTime specifies the absolute date and time where the individual speech item started, optional attribute endTime specifies the absolute date and time where the individual speech item ended, and optional attribute to identifies the addressee of the speech. All of them are references to person or organization elements in the references section."
