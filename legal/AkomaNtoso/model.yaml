        "name": "lang"
        "description": "These attribute specify the human language in which the content of the element is expressed as well as the rules for whitespace management in the element. Values for xml:lang are taken from the RFC 4646. Both xml:lang and xml:space are reserved attributes of the XML language, and cannot be used for any other purpose than these ones."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_xmllang.html"
        "extensions":
          "custom":
            "xsdAttribute": "xml:lang"
            "xsdType": "xml:lang"
            "attributeGroup": "xmllang"
      "alternativeTo":
