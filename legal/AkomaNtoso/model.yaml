            "xsdAttribute": "to"
            "xsdType": "agentRef"
            "attributeGroup": "speechAtts"
      "num":
        "type": "LIST<STRING>"
        "name": "num"
        "description": "The element num is a heading element in a hierarchy that contains a number or any other ordered mechanism to identify the structure."
