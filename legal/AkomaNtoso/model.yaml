            "xsdAttribute": "value"
            "xsdType": "xsd:string"
            "lower": 0
      "frbrName":
        "type": "LIST<STRING>"
        "name": "frbrName"
        "description": "The element FRBRname is the metadata property containing a string for the title to be used in the work-level IRI of this document."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_FRBRname.html"
        "extensions":
