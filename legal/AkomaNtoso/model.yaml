  "ContentElement":
    "labels":
      "identifier": "ContentElement"
    "description": "An element of a document's content, which has the core attributes all such elements have: its identifiers (eId, wId and GUID), the elements of the references section it refers to (refersTo), the time interval it is in force or in efficacy (period), its status, its language and the element it is an alternative to."
    "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_corereq.html"
