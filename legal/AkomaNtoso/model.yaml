            "xsdAttribute": "value"
            "xsdType": "xsd:string"
            "lower": 0
      "frbrPrescriptive":
        "type": "BOOLEAN"
        "name": "frbrPrescriptive"
        "description": "The element FRBRprescriptive is the metadata property containing a boolean value to determine whether the document contains prescriptive text (i.e., text that is or might become prescriptive, such as an act or a bill) or not (such as, for instance, a non-normative resolution from an assembly."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_FRBRprescriptive.html"
        "extensions":
          "custom":
            "xsdElement": "FRBRprescriptive"
            "xsdAttribute": "value"
            "xsdType": "xsd:boolean"
            "lower": 0
            "upper": 1
      "frbrAuthoritative":
        "type": "BOOLEAN"
        "name": "frbrAuthoritative"
        "description": "The element FRBRauthoritative is the metadata property containing a boolean value to determine whether the document contains authoritative text (i.e., content that is the official, authoritative product of an official workflow from an entity that is entrusted with generating an official, authoriative version of the document."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_FRBRauthoritative.html"
