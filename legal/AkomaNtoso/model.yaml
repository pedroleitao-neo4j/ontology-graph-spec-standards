        "name": "start"
        "description": "The start and end attributes are used to specify events that mark the beginning and the end of a time interval. Both are references to eventRef elements in the lifecycle element. Resolved to the EventRef it identifies by the start relationship."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_interval.html"
