        "reference": "https://docs.oasis-open.org/legaldocml/akn-nc/v1.0/os/akn-nc-v1.0-os.html"
    "constraints":
      "key_Alinea":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Alinea_key"
    "extensions":
      "custom":
        "area": "Structure"
        "xsdElement": "alinea"
        "xsdType": "hierarchy"
  "AlternativeReference":
    "labels":
      "identifier": "AlternativeReference"
    "description": "The element alternativeReference contains an alternative reference (e.g., using a different namespace) for a legal reference."
    "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_alternativeReference.html"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the AlternativeReference: an IRI unique across documents. For a document, its expression IRI, e.g. /akn/ke/act/2010-08-27/1/eng@; for an element within a document, the document's IRI followed by # and the element's eId, or where it has none its wId, GUID or an identifier the loader assigns."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-nc/v1.0/os/akn-nc-v1.0-os.html"
      "eId":
        "type": "STRING"
        "name": "eId"
        "description": "These attributes identify the element in an absolute manner. In elements using this attribute definition the eId attribute is optional. The wId is used to mark the identifier that the structure used to have in the original version, and is only needed when a renumbering occurred."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_idopt.html"
        "extensions":
          "custom":
            "xsdAttribute": "eId"
            "xsdType": "noWhiteSpace"
            "attributeGroup": "idopt"
      "wId":
        "type": "STRING"
        "name": "wId"
        "description": "These attributes identify the element in an absolute manner. In elements using this attribute definition the eId attribute is optional. The wId is used to mark the identifier that the structure used to have in the original version, and is only needed when a renumbering occurred."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_idopt.html"
        "extensions":
          "custom":
            "xsdAttribute": "wId"
            "xsdType": "noWhiteSpace"
            "attributeGroup": "idopt"
      "guid":
        "type": "STRING"
        "name": "guid"
        "description": "These attributes identify the element in an absolute manner. In elements using this attribute definition the eId attribute is optional. The wId is used to mark the identifier that the structure used to have in the original version, and is only needed when a renumbering occurred."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_idopt.html"
        "extensions":
          "custom":
            "xsdAttribute": "GUID"
            "xsdType": "noWhiteSpace"
            "attributeGroup": "idopt"
      "href":
        "type": "STRING"
        "name": "href"
        "description": "The attribute href is used to specify an internal or external destination for a reference, a citation, an access to the ontology or a hypertext link. In elements using this attribute definition the href attribute is optional."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_linkopt.html"
        "extensions":
          "custom":
            "xsdAttribute": "href"
            "xsdType": "xsd:anyURI"
            "attributeGroup": "linkopt"
      "for":
        "type": "STRING"
        "name": "for"
        "description": "The for of the AlternativeReference."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_alternativeReference.html"
        "extensions":
          "custom":
            "xsdAttribute": "for"
            "xsdType": "eIdRef"
      "refersTo":
        "type": "LIST<STRING>"
        "name": "refersTo"
        "description": "This attribute creates a connection between the element and an element of the Akoma Ntoso ontology to which it refers. In elements using this attribute definition the refersTo attribute is optional. Resolved to the RefItem it identifies by the refers to relationship."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_refers.html"
        "extensions":
          "custom":
            "xsdAttribute": "refersTo"
            "xsdType": "referenceRef"
            "attributeGroup": "refers"
      "showAs":
        "type": "STRING"
        "name": "showAs"
        "description": "The showAs of the AlternativeReference."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_showopt.html"
        "extensions":
          "custom":
            "xsdAttribute": "showAs"
            "xsdType": "xsd:string"
            "attributeGroup": "showopt"
      "shortForm":
        "type": "STRING"
        "name": "shortForm"
        "description": "The shortForm of the AlternativeReference."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_showopt.html"
        "extensions":
          "custom":
            "xsdAttribute": "shortForm"
            "xsdType": "xsd:string"
            "attributeGroup": "showopt"
    "constraints":
