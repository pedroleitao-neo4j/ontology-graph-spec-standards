"schema": "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json"
"version": "1.0"
"id": "akoma-ntoso-1.0"
"name": "Akoma Ntoso 1.0"
"description": "Akoma Ntoso Version 1.0 (OASIS LegalDocML), the OASIS Standard of 29 August 2018 for the XML representation of parliamentary, legislative and judiciary documents: acts, bills, amendments, debates, judgments, official gazettes and other documents, their structure down to articles and paragraphs, their FRBR identification, lifecycle, workflow and analysis metadata, and the people, organizations, concepts and other documents their text refers to. Generated from the Akoma Ntoso 3.0 XML schema (akomantoso30.xsd): each legal element is a node, each attribute and each value element a property, each element contained and each attribute referring to another element by its eId a relationship, and each element group a label its elements also carry."
"nodes":
  "Act":
    "labels":
      "identifier": "Act"
      "implied":
        - "Document"
    "description": "Element act is used for describing the structure and content of an act."
    "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_act.html"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Act: its FRBR Expression IRI, e.g. /akn/ke/act/2010-08-27/1/eng@, unique across documents."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-nc/v1.0/os/akn-nc-v1.0-os.html"
      "name":
        "type": "STRING"
        "name": "name"
        "description": "The attribute name is used to give a name to all generic elements."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_name.html"
        "extensions":
          "custom":
            "xsdAttribute": "name"
            "xsdType": "xsd:string"
            "attributeGroup": "name"
      "contains":
        "type": "STRING"
        "name": "contains"
        "description": "The attribute contains is used in the root of document types to indicate whether the document is original or modified wrt the orignal version. One of `originalVersion`, `singleVersion` and `multipleVersions`."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_contains.html"
        "extensions":
          "custom":
            "xsdAttribute": "contains"
            "xsdType": "versionType"
            "attributeGroup": "contains"
        "one_of":
          - "originalVersion"
          - "singleVersion"
          - "multipleVersions"
    "constraints":
      "key_Act":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Act_key"
      "exists_Act_name":
        "type": "EXISTS"
        "properties":
          - "name"
        "name": "name_Act_exists"
    "extensions":
      "custom":
        "area": "Document"
        "xsdElement": "act"
        "xsdType": "hierarchicalStructure"
  "ActiveModifications":
    "labels":
      "identifier": "ActiveModifications"
    "description": "The element activeModifications is a metadata container of the active modifications generated by the document."
    "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_activeModifications.html"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the ActiveModifications: an IRI unique across documents. For a document, its expression IRI, e.g. /akn/ke/act/2010-08-27/1/eng@; for an element within a document, the document's IRI followed by # and the element's eId, or where it has none its wId, GUID or an identifier the loader assigns."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-nc/v1.0/os/akn-nc-v1.0-os.html"
    "constraints":
      "key_ActiveModifications":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_ActiveModifications_key"
    "extensions":
      "custom":
        "area": "Metadata"
        "xsdElement": "activeModifications"
        "xsdType": "Amendments"
  "ActiveRef":
    "labels":
      "identifier": "ActiveRef"
      "implied":
        - "DocRef"
    "description": "The element activeRef is a metadata reference to the Akoma Ntoso IRI of a document that is modified by this document (i.e., an active references)."
    "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_activeRef.html"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the ActiveRef: an IRI unique across documents. For a document, its expression IRI, e.g. /akn/ke/act/2010-08-27/1/eng@; for an element within a document, the document's IRI followed by # and the element's eId, or where it has none its wId, GUID or an identifier the loader assigns."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-nc/v1.0/os/akn-nc-v1.0-os.html"
    "constraints":
      "key_ActiveRef":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_ActiveRef_key"
    "extensions":
      "custom":
        "area": "Reference"
        "xsdElement": "activeRef"
        "xsdType": "referenceType"
  "Address":
    "labels":
      "identifier": "Address"
      "implied":
        - "SpeechSection"
    "description": "This element is a structural container for parts of a debates that are relevant to addresses."
    "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_address.html"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Address: an IRI unique across documents. For a document, its expression IRI, e.g. /akn/ke/act/2010-08-27/1/eng@; for an element within a document, the document's IRI followed by # and the element's eId, or where it has none its wId, GUID or an identifier the loader assigns."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-nc/v1.0/os/akn-nc-v1.0-os.html"
    "constraints":
      "key_Address":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Address_key"
    "extensions":
      "custom":
        "area": "Structure"
        "xsdElement": "address"
        "xsdType": "althierarchy"
  "Adjournment":
    "labels":
      "identifier": "Adjournment"
      "implied":
        - "SpeechSection"
    "description": "This element is a structural container for parts of a debates that contain adjournment notices."
    "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_adjournment.html"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Adjournment: an IRI unique across documents. For a document, its expression IRI, e.g. /akn/ke/act/2010-08-27/1/eng@; for an element within a document, the document's IRI followed by # and the element's eId, or where it has none its wId, GUID or an identifier the loader assigns."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-nc/v1.0/os/akn-nc-v1.0-os.html"
    "constraints":
      "key_Adjournment":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Adjournment_key"
    "extensions":
      "custom":
        "area": "Structure"
        "xsdElement": "adjournment"
        "xsdType": "althierarchy"
  "AdministrationOfOath":
    "labels":
      "identifier": "AdministrationOfOath"
      "implied":
        - "SpeechSection"
    "description": "This element is a structural container for parts of a debates that contain the administration of an oath."
    "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_administrationOfOath.html"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the AdministrationOfOath: an IRI unique across documents. For a document, its expression IRI, e.g. /akn/ke/act/2010-08-27/1/eng@; for an element within a document, the document's IRI followed by # and the element's eId, or where it has none its wId, GUID or an identifier the loader assigns."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-nc/v1.0/os/akn-nc-v1.0-os.html"
    "constraints":
      "key_AdministrationOfOath":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_AdministrationOfOath_key"
    "extensions":
      "custom":
        "area": "Structure"
        "xsdElement": "administrationOfOath"
        "xsdType": "althierarchy"
  "AffectedDocument":
    "labels":
      "identifier": "AffectedDocument"
      "implied":
        - "AmendmentInline"
    "description": "The element affectedDocument is an inline element within preamble to identify the document that this amendment affects."
    "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_affectedDocument.html"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the AffectedDocument: an IRI unique across documents. For a document, its expression IRI, e.g. /akn/ke/act/2010-08-27/1/eng@; for an element within a document, the document's IRI followed by # and the element's eId, or where it has none its wId, GUID or an identifier the loader assigns."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-nc/v1.0/os/akn-nc-v1.0-os.html"
      "href":
        "type": "STRING"
        "name": "href"
        "description": "The attribute href is used to specify an internal or external destination for a reference, a citation, an access to the ontology or a hypertext link. In elements using this attribute definition the href attribute is required."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_link.html"
        "extensions":
          "custom":
            "xsdAttribute": "href"
            "xsdType": "xsd:anyURI"
            "attributeGroup": "link"
    "constraints":
      "key_AffectedDocument":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_AffectedDocument_key"
      "exists_AffectedDocument_href":
        "type": "EXISTS"
        "properties":
          - "href"
        "name": "href_AffectedDocument_exists"
    "extensions":
      "custom":
        "area": "Reference"
        "xsdElement": "affectedDocument"
  "Agent":
    "labels":
      "identifier": "Agent"
      "implied":
        - "TLC"
    "description": "An agent: a person or an organization of the references section, which the attributes typed agentRef, e.g. by, source, to and empoweredBy, refer to. A label carried by TLCOrganization and TLCPerson."
    "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Simple_Type_agentRef.html"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Agent: an IRI unique across documents. For a document, its expression IRI, e.g. /akn/ke/act/2010-08-27/1/eng@; for an element within a document, the document's IRI followed by # and the element's eId, or where it has none its wId, GUID or an identifier the loader assigns."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-nc/v1.0/os/akn-nc-v1.0-os.html"
    "constraints":
      "key_Agent":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Agent_key"
    "extensions":
      "custom":
        "area": "Reference"
        "abstract": true
  "AkomaNtoso":
    "labels":
      "identifier": "AkomaNtoso"
    "description": "NAME akomaNtoso the element akomaNtoso is the root element of all document types in Akoma Ntoso. It follows the pattern Universal Root (http://www.xmlpatterns.com/UniversalRootMain.shtml)."
    "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_akomaNtoso.html"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the AkomaNtoso: an IRI unique across documents. For a document, its expression IRI, e.g. /akn/ke/act/2010-08-27/1/eng@; for an element within a document, the document's IRI followed by # and the element's eId, or where it has none its wId, GUID or an identifier the loader assigns."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-nc/v1.0/os/akn-nc-v1.0-os.html"
    "constraints":
      "key_AkomaNtoso":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_AkomaNtoso_key"
    "extensions":
      "custom":
        "area": "Document"
        "xsdElement": "akomaNtoso"
        "xsdType": "akomaNtosoType"
  "Alinea":
    "labels":
      "identifier": "Alinea"
      "implied":
        - "Hierarchy"
    "description": "This element is a hierarchical container called \"alinea\" either explicitly or due to the local tradition."
    "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_alinea.html"
    "properties":
