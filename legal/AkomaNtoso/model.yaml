  "EventRef":
    "labels":
      "identifier": "EventRef"
    "description": "The element eventRef is a metadata element specifying facts about an event that had an effect on the document. For each event, a date, a type and a document that generated the event must be referenced."
    "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Element_eventRef.html"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the EventRef: an IRI unique across documents. For a document, its expression IRI, e.g. /akn/ke/act/2010-08-27/1/eng@; for an element within a document, the document's IRI followed by # and the element's eId, or where it has none its wId, GUID or an identifier the loader assigns."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-nc/v1.0/os/akn-nc-v1.0-os.html"
      "eId":
        "type": "STRING"
        "name": "eId"
        "description": "These attributes identify the element in an absolute manner. In elements using this attribute definition the eId attribute is optional. The wId is used to mark the identifier that the structure used to have in the original version, and is only needed when a renumbering occurred."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_idopt.html"
        "extensions":
          "custom":
            "xsdAttribute": "eId"
            "xsdType": "noWhiteSpace"
            "attributeGroup": "idopt"
      "wId":
        "type": "STRING"
        "name": "wId"
        "description": "These attributes identify the element in an absolute manner. In elements using this attribute definition the eId attribute is optional. The wId is used to mark the identifier that the structure used to have in the original version, and is only needed when a renumbering occurred."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_idopt.html"
        "extensions":
          "custom":
            "xsdAttribute": "wId"
            "xsdType": "noWhiteSpace"
            "attributeGroup": "idopt"
      "guid":
        "type": "STRING"
        "name": "guid"
