        "name": "uri"
        "description": "The identifier of the TimeInterval: an IRI unique across documents. For a document, its expression IRI, e.g. /akn/ke/act/2010-08-27/1/eng@; for an element within a document, the document's IRI followed by # and the element's eId, or where it has none its wId, GUID or an identifier the loader assigns."
