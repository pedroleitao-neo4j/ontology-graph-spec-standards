        "reference": "https://docs.oasis-open.org/legaldocml/akn-nc/v1.0/os/akn-nc-v1.0-os.html"
      "period":
        "type": "STRING"
        "name": "period"
        "description": "The period attribute is used in versioned content and metadata elements to indicate a time interval in which they were in force, in efficacy, or in any other type of interval as specified in the corresponding temporalGroup. Resolved to the TemporalGroup it identifies by the period relationship."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_period.html"
        "extensions":
          "custom":
            "xsdAttribute": "period"
            "xsdType": "temporalGroupRef"
            "attributeGroup": "period"
      "status":
        "type": "STRING"
        "name": "status"
        "description": "These attributes are those already defined in attribute list \"period\", plus the attribute status, that allows to specify the status of the piece of text it wraps. One of `removed`, `temporarilyRemoved`, `translated`, `editorial`, `edited`, `verbatim`, `incomplete`, `unknown`, `undefined` and `ignored`."
        "reference": "https://docs.oasis-open.org/legaldocml/akn-core/v1.0/os/part2-specs/os-part2-specs_xsd_Attribute_Group_enactment.html"
        "extensions":
          "custom":
            "xsdAttribute": "status"
            "xsdType": "statusType"
            "attributeGroup": "enactment"
        "one_of":
          - "removed"
          - "temporarilyRemoved"
          - "translated"
          - "editorial"
          - "edited"
          - "verbatim"
          - "incomplete"
          - "unknown"
          - "undefined"
          - "ignored"
