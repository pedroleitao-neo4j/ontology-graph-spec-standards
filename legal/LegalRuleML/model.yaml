"schema": "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json"
"version": "1.0"
"id": "legalruleml-1.0"
"name": "LegalRuleML 1.0"
"description": "The RDFS metamodel of LegalRuleML 1.0, an OASIS Standard of 30 August 2021 published by the OASIS LegalRuleML Technical Committee (https://www.oasis-open.org/committees/legalruleml/). LegalRuleML is a language for legal rules: the deontic specifications, e.g. obligations, prohibitions, permissions, rights and the suborder lists that chain them, that legal sources give rise to; the defeasible rules, strengths and overrides that resolve conflicts between them; and the statements, sources, references, authorities, jurisdictions, actors, roles and times they are stated in, hold for and are applied in. It extends RuleML with features specific to legal norms, guidelines and policies, and is a companion to Akoma Ntoso, which it follows in identifying the documents rules are found in. Generated from the twelve RDFS modules of the Core Specification: each class is a node, each property whose domain and range are classes of the modules a relationship from its domain to its range, each property with a literal range a property of its domain, and each superclass an implied label."
