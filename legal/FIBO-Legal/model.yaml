"schema": "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json"
"version": "2026-10"
"id": "fibo-legal-2026-10"
"name": "FIBO legal modules"
"description": "The legal modules of the Financial Industry Business Ontology (FIBO), developed by the EDM Council and the Object Management Group (https://spec.edmcouncil.org/fibo) and licensed under MIT. This subset covers the concepts financial agreements and the law around them are built on: the legal core of laws, jurisdictions and legal relations; legal capacity, obligations and the authority to act; agreements, contracts and their terms and parties; parties and the roles they play; and natural persons and the legal persons that are responsible for them, such as formal organizations. It is generated from the six entry modules of the FIBO repository's master branch and the modules their owl:imports close over, which adds the FIBO foundations and the OMG Commons Ontology Library they are built on: each class is a node, each object property a relationship from its domain to its range (one direction per inverse pair), each datatype property a property, each class restriction a count, and each superclass an implied label."
"nodes":
  "Thing":
    "labels":
      "identifier": "Thing"
    "description": "Anything at all: owl:Thing, which every class of the closure sits under. The label every node carries, and the end of the relationships FIBO and Commons leave open to any individual."
    "reference": "http://www.w3.org/2002/07/owl#Thing"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Thing individual: its IRI in FIBO data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
    "constraints":
      "key_Thing":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Thing_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/2002/07/owl#Thing"
        "module": "owl"
        "area": "Commons foundations and other support modules"
