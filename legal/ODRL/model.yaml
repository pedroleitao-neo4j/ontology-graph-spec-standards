        "area": "Policies and rules"
  "Privacy":
    "labels":
      "identifier": "Privacy"
      "implied":
        - "Policy"
    "description": "A Policy that expresses a Rule over an Asset containing personal information. A Privacy Policy MUST contain a target Asset, a Party with Assigner is, a Party with Assignee function, and at least one of a Permission or Prohibition rule that MUST include a Duty. The target Asset SHOULD contain or relate to personal information about the Assignee. The Duty MUST describe obligations on the Assigner about managing the Asset. The Assignee is being granted the terms of the Privacy policy from the Assigner."
    "reference": "http://www.w3.org/ns/odrl/2/Privacy"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Privacy individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
    "constraints":
      "key_Privacy":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Privacy_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/ns/odrl/2/Privacy"
        "area": "Policies and rules"
        "disjointWith":
          - "Agreement"
          - "Assertion"
          - "Offer"
          - "Request"
          - "Ticket"
  "Prohibition":
    "labels":
      "identifier": "Prohibition"
      "implied":
        - "Rule"
    "description": "The inability to perform an Action over an Asset."
    "reference": "http://www.w3.org/ns/odrl/2/Prohibition"
    "properties":
      "uri":
