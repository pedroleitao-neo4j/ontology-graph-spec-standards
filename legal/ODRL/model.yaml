        "area": "Policies and rules"
  "Set":
    "labels":
      "identifier": "Set"
      "implied":
        - "Policy"
    "description": "A Policy that expresses a Rule over an Asset. A Set Policy MUST contain a target Asset, and at least one Rule. A Set Policy is the default Policy subclass. The Set is aimed at scenarios where there is an open criteria for the semantics of the policy expressions and typically refined by other systems/profiles that process the information at a later time. No privileges are granted to any Party (if defined)."
    "reference": "http://www.w3.org/ns/odrl/2/Set"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Set individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
    "constraints":
      "key_Set":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Set_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/ns/odrl/2/Set"
        "area": "Policies and rules"
        "disjointWith":
          - "Agreement"
          - "Assertion"
          - "Offer"
          - "Privacy"
          - "Request"
          - "Ticket"
  "Ticket":
    "labels":
      "identifier": "Ticket"
      "implied":
        - "Policy"
    "description": "A Policy that grants the holder a Rule over an Asset from an assigner. A Ticket Policy MUST contain a target Asset and at least one of a Permission or Prohibition rule. The Ticket MAY contain the Party with Assigner function and MUST NOT contain an Assignee. The Ticket Policy will grant the terms of the Policy to the holder of that Ticket. The holder of the Ticket MAY remain unknown or MAY have to be identified at some later stage."
    "reference": "http://www.w3.org/ns/odrl/2/Ticket"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Ticket individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
    "constraints":
