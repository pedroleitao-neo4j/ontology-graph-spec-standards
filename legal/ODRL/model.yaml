        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Ticket_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/ns/odrl/2/Ticket"
        "area": "Policies and rules"
        "disjointWith":
          - "Agreement"
          - "Assertion"
          - "Offer"
          - "Privacy"
          - "Request"
