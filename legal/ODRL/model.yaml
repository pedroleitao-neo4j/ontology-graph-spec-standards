        "name": "uri_Prohibition_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/ns/odrl/2/Prohibition"
        "area": "Policies and rules"
        "disjointWith":
          - "Duty"
          - "Permission"
  "Request":
    "labels":
      "identifier": "Request"
      "implied":
        - "Policy"
    "description": "A Policy that proposes a Rule over an Asset from an assignee. A Request Policy MUST contain a target Asset, a Party with Assignee function, and at least one of a Permission or Prohibition rule. The Request MAY also contain the Party with Assigner function if this is known. No privileges are granted to any Party."
    "reference": "http://www.w3.org/ns/odrl/2/Request"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Request individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
    "constraints":
      "key_Request":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Request_key"
    "extensions":
