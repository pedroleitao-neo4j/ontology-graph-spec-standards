  "Duty_CONSEQUENCE_Duty":
    "type": "CONSEQUENCE"
    "from":
      "node": "Duty"
    "to":
      "node": "Duty"
    "description": "Relates a Duty to another Duty, the latter being a consequence of not fulfilling the former. The consequence property is utilised to express the repercussions of not fulfilling an agreed Policy obligation or duty for a Permission. If either of these fails to be fulfilled, then this will result in the consequence Duty also becoming a new requirement, meaning that the original obligation or duty, as well as the consequence Duty must all be fulfilled."
    "reference": "http://www.w3.org/ns/odrl/2/consequence"
