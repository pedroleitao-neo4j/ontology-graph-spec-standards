        "area": "Constraints and operands"
  "Rule":
    "labels":
      "identifier": "Rule"
      "implied":
        - "Thing"
    "description": "An abstract concept that represents the common characteristics of Permissions, Prohibitions, and Duties. Rule is an abstract concept."
    "reference": "http://www.w3.org/ns/odrl/2/Rule"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Rule individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
      "uid":
        "type": "LIST<STRING>"
        "name": "uid"
        "description": "An unambiguous identifier. Used by the Policy, Rule, Asset, Party, Constraint, and Logical Constraint Classes. Holds the IRI of each resource it refers to, which ODRL leaves unconstrained."
        "reference": "http://www.w3.org/ns/odrl/2/uid"
        "extensions":
          "custom":
