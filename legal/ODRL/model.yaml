  "Policy":
    "labels":
      "identifier": "Policy"
      "implied":
        - "Thing"
    "description": "A non-empty group of Permissions and/or Prohibitions. A Policy may contain multiple Rules."
    "reference": "http://www.w3.org/ns/odrl/2/Policy"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Policy individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
      "profile":
        "type": "LIST<STRING>"
        "name": "profile"
        "description": "The identifier(s) of an ODRL Profile that the Policy conforms to. The profile property is mandatory if the Policy is using an ODRL Profile. Holds the IRI of each resource it refers to, which ODRL leaves unconstrained."
        "reference": "http://www.w3.org/ns/odrl/2/profile"
        "extensions":
          "custom":
            "iri": "http://www.w3.org/ns/odrl/2/profile"
      "uid":
        "type": "LIST<STRING>"
        "name": "uid"
        "description": "An unambiguous identifier. Used by the Policy, Rule, Asset, Party, Constraint, and Logical Constraint Classes. Holds the IRI of each resource it refers to, which ODRL leaves unconstrained."
        "reference": "http://www.w3.org/ns/odrl/2/uid"
        "extensions":
          "custom":
            "iri": "http://www.w3.org/ns/odrl/2/uid"
            "unionEnds": true
    "constraints":
      "key_Policy":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Policy_key"
    "extensions":
      "custom":
