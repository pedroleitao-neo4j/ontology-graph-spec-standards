"schema": "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json"
"version": "2.2"
"id": "odrl-2.2"
"name": "ODRL 2.2"
"description": "ODRL 2.2, the Open Digital Rights Language vocabulary published by the W3C in the ODRL Vocabulary and Expression 2.2 Recommendation of 15 February 2018 (https://www.w3.org/TR/vocab-odrl/), alongside the ODRL Information Model 2.2 it expresses. ODRL is a policy expression language: a machine-readable way to state what may and may not be done with content and services, and what must be done in return. A Policy — an Agreement, Offer, Request, Ticket, Assertion, Privacy policy or Set — holds Permissions, Prohibitions and Duties; each Rule grants one Action over a target Asset to Parties in functional roles such as assignee and assigner, and is refined by Constraints and Logical Constraints over Operators and left and right operands, with conflict and undefined-term strategies at the Policy level. It is used for digital licensing and usage policies across sectors, and extended by the community profiles built on the ODRL Core Vocabulary. Generated from the ODRL Version 2.2 RDF vocabulary: each class is a node, each object property a relationship from its domain to its range (one per class of a union), each datatype property and each property without a class range a node property, and each superclass an implied label. The individuals ODRL defines — the actions, left operands, operators and the like — are values a data set refers to by IRI, not nodes."
"nodes":
  "Thing":
    "labels":
      "identifier": "Thing"
    "description": "Anything at all: owl:Thing. ODRL leaves most of its classes without a superclass — Policy, Rule, Asset and the constraint classes stand alone, and the ones that do specialise classes outside ODRL: a Party is a foaf:Agent, an Action a schema:Action. Each of these roots carries the Thing label, making one tree of the model."
    "reference": "http://www.w3.org/2002/07/owl#Thing"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Thing individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
    "constraints":
      "key_Thing":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Thing_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/2002/07/owl#Thing"
        "area": "Thing"
  "Action":
    "labels":
      "identifier": "Action"
      "implied":
        - "Thing"
    "description": "An operation on an Asset. Actions may be allowed by Permissions, disallowed by Prohibitions, or made mandatory by Duties. Specialises schema:Action."
    "reference": "http://www.w3.org/ns/odrl/2/Action"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Action individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
    "constraints":
      "key_Action":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Action_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/ns/odrl/2/Action"
        "area": "Actions"
        "subClassOf":
          - "schema:Action"
  "Agreement":
    "labels":
      "identifier": "Agreement"
      "implied":
        - "Policy"
    "description": "A Policy that grants the assignee a Rule over an Asset from an assigner. An Agreement Policy MUST contain at least one Permission or Prohibition rule, a Party with Assigner function, and a Party with Assignee function (in the same Permission or Prohibition). The Agreement Policy will grant the terms of the Policy from the Assigner to the Assignee."
    "reference": "http://www.w3.org/ns/odrl/2/Agreement"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Agreement individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
    "constraints":
      "key_Agreement":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Agreement_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/ns/odrl/2/Agreement"
        "area": "Policies and rules"
        "disjointWith":
          - "Assertion"
          - "Offer"
          - "Privacy"
          - "Request"
          - "Ticket"
  "Assertion":
    "labels":
      "identifier": "Assertion"
      "implied":
        - "Policy"
    "description": "A Policy that asserts a Rule over an Asset from parties. For example, a party (an assignee or assigner) can claim what terms they have over an Asset. An Assertion Policy does not grant such permissions/prohibitions but only asserts the parties claims. An Assetion Policy MUST contain a target Asset, a Party with any functional role, and at least one of a Permission or Prohibition rule."
    "reference": "http://www.w3.org/ns/odrl/2/Assertion"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Assertion individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
    "constraints":
      "key_Assertion":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Assertion_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/ns/odrl/2/Assertion"
        "area": "Policies and rules"
        "disjointWith":
          - "Offer"
          - "Privacy"
          - "Request"
          - "Ticket"
  "Asset":
    "labels":
      "identifier": "Asset"
      "implied":
        - "Thing"
    "description": "A resource or a collection of resources that are the subject of a Rule. The Asset entity can be any form of identifiable resource, such as data/information, content/media, applications, or services. Furthermore, it can be used to represent other Asset entities that are needed to undertake the Policy expression, such as with the Duty entity. To describe more details about the Asset, it is recommended to use Dublin Core [[dcterms]] elements or other content metadata."
    "reference": "http://www.w3.org/ns/odrl/2/Asset"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Asset individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
      "uid":
        "type": "LIST<STRING>"
        "name": "uid"
        "description": "An unambiguous identifier. Used by the Policy, Rule, Asset, Party, Constraint, and Logical Constraint Classes. Holds the IRI of each resource it refers to, which ODRL leaves unconstrained."
        "reference": "http://www.w3.org/ns/odrl/2/uid"
        "extensions":
          "custom":
            "iri": "http://www.w3.org/ns/odrl/2/uid"
            "unionEnds": true
    "constraints":
      "key_Asset":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Asset_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/ns/odrl/2/Asset"
        "area": "Assets and parties"
  "AssetCollection":
    "labels":
      "identifier": "AssetCollection"
      "implied":
        - "Asset"
    "description": "An Asset that is collection of individual resources."
    "reference": "http://www.w3.org/ns/odrl/2/AssetCollection"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the AssetCollection individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
      "source":
        "type": "LIST<STRING>"
        "name": "source"
        "description": "Reference to a Asset/PartyCollection. Used by AssetCollection and PartyCollection when constraints are applied. Holds the IRI of each resource it refers to, which ODRL leaves unconstrained."
        "reference": "http://www.w3.org/ns/odrl/2/source"
        "extensions":
          "custom":
            "iri": "http://www.w3.org/ns/odrl/2/source"
            "unionEnds": true
    "constraints":
      "key_AssetCollection":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_AssetCollection_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/ns/odrl/2/AssetCollection"
        "area": "Assets and parties"
  "AssetScope":
    "labels":
      "identifier": "AssetScope"
      "implied":
        - "Thing"
    "description": "Scopes for Asset Scope expressions. Instances of the AssetScope class represent the terms for the scope property of Assets. Deprecated."
    "reference": "http://www.w3.org/ns/odrl/2/AssetScope"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the AssetScope individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
    "constraints":
      "key_AssetScope":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_AssetScope_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/ns/odrl/2/AssetScope"
        "area": "Assets and parties"
        "deprecated": true
  "ConflictTerm":
    "labels":
      "identifier": "ConflictTerm"
      "implied":
        - "Thing"
    "description": "Used to establish strategies to resolve conflicts that arise from the merging of Policies or conflicts between Permissions and Prohibitions in the same Policy. Instances of ConflictTerm describe strategies for resolving conflicts."
    "reference": "http://www.w3.org/ns/odrl/2/ConflictTerm"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the ConflictTerm individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
    "constraints":
      "key_ConflictTerm":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_ConflictTerm_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/ns/odrl/2/ConflictTerm"
        "area": "Constraints and operands"
  "Constraint":
    "labels":
      "identifier": "Constraint"
      "implied":
        - "Thing"
    "description": "A boolean expression that refines the semantics of an Action and Party/Asset Collection or declare the conditions applicable to a Rule."
    "reference": "http://www.w3.org/ns/odrl/2/Constraint"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Constraint individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
      "dataType":
        "type": "LIST<STRING>"
        "name": "dataType"
        "description": "The datatype of the value of the rightOperand or rightOperandReference of a Constraint. In RDF encodings, use of the rdf:datatype MUST be used. In JSON-LD encoding, the use of @type MUST be used. Holds the IRI of the datatype of the value, e.g. xsd:date."
        "reference": "http://www.w3.org/ns/odrl/2/dataType"
        "extensions":
          "custom":
            "iri": "http://www.w3.org/ns/odrl/2/dataType"
            "datatypes":
              - "rdfs:Datatype"
      "rightOperand":
        "type": "LIST<STRING>"
        "name": "rightOperand"
        "description": "The value of the right operand in a constraint expression. When used with set-based operators, a list of values may be used. Holds the value, or the IRI of one of the RightOperand individuals ODRL defines."
        "reference": "http://www.w3.org/ns/odrl/2/rightOperand"
        "extensions":
          "custom":
            "iri": "http://www.w3.org/ns/odrl/2/rightOperand"
            "datatypes":
              - "odrl:RightOperand"
              - "rdfs:Literal"
              - "xsd:anyURI"
      "rightOperandReference":
        "type": "LIST<STRING>"
        "name": "rightOperandReference"
        "description": "A reference to a web resource providing the value for the right operand of a Constraint. An IRI that MUST be dereferenced to obtain the actual right operand value. When used with set-based operators, a list of IRIs may be used. Holds the IRI of each resource it refers to, which ODRL leaves unconstrained."
        "reference": "http://www.w3.org/ns/odrl/2/rightOperandReference"
        "extensions":
          "custom":
            "iri": "http://www.w3.org/ns/odrl/2/rightOperandReference"
      "status":
        "type": "LIST<STRING>"
        "name": "status"
        "description": "The value generated from the leftOperand action or a value related to the leftOperand set as the reference for the comparison. Holds the IRI of each resource it refers to, which ODRL leaves unconstrained."
        "reference": "http://www.w3.org/ns/odrl/2/status"
        "extensions":
          "custom":
            "iri": "http://www.w3.org/ns/odrl/2/status"
      "uid":
        "type": "LIST<STRING>"
        "name": "uid"
        "description": "An unambiguous identifier. Used by the Policy, Rule, Asset, Party, Constraint, and Logical Constraint Classes. Holds the IRI of each resource it refers to, which ODRL leaves unconstrained."
        "reference": "http://www.w3.org/ns/odrl/2/uid"
        "extensions":
          "custom":
            "iri": "http://www.w3.org/ns/odrl/2/uid"
            "unionEnds": true
      "unit":
        "type": "LIST<STRING>"
        "name": "unit"
        "description": "The unit of measurement of the value of the rightOperand or rightOperandReference of a Constraint. Holds the IRI of each resource it refers to, which ODRL leaves unconstrained."
        "reference": "http://www.w3.org/ns/odrl/2/unit"
        "extensions":
          "custom":
            "iri": "http://www.w3.org/ns/odrl/2/unit"
    "constraints":
      "key_Constraint":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Constraint_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/ns/odrl/2/Constraint"
        "area": "Constraints and operands"
  "Duty":
    "labels":
      "identifier": "Duty"
      "implied":
        - "Rule"
    "description": "The obligation to perform an Action."
    "reference": "http://www.w3.org/ns/odrl/2/Duty"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Duty individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
    "constraints":
      "key_Duty":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Duty_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/ns/odrl/2/Duty"
        "area": "Policies and rules"
        "disjointWith":
          - "Permission"
          - "Prohibition"
  "LeftOperand":
    "labels":
      "identifier": "LeftOperand"
      "implied":
        - "Thing"
    "description": "Left operand for a constraint expression. Instances of the LeftOperand class are used as the leftOperand of a Constraint."
    "reference": "http://www.w3.org/ns/odrl/2/LeftOperand"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the LeftOperand individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
    "constraints":
      "key_LeftOperand":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_LeftOperand_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/ns/odrl/2/LeftOperand"
        "area": "Constraints and operands"
  "LogicalConstraint":
    "labels":
      "identifier": "LogicalConstraint"
      "implied":
        - "Thing"
    "description": "A logical expression that refines the semantics of an Action and Party/Asset Collection or declare the conditions applicable to a Rule."
    "reference": "http://www.w3.org/ns/odrl/2/LogicalConstraint"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the LogicalConstraint individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
      "and":
        "type": "LIST<STRING>"
        "name": "and"
        "description": "The relation is satisfied when all of the Constraints are satisfied. This property MUST only be used for Logical Constraints, and the list of operand values MUST be Constraint instances. Holds the IRI of each resource it refers to, which ODRL leaves unconstrained."
        "reference": "http://www.w3.org/ns/odrl/2/and"
        "extensions":
          "custom":
            "iri": "http://www.w3.org/ns/odrl/2/and"
            "subPropertyOf":
              - "operand"
      "andSequence":
        "type": "LIST<STRING>"
        "name": "andSequence"
        "description": "The relation is satisfied when each of the Constraints are satisfied in the order specified. This property MUST only be used for Logical Constraints, and the list of operand values MUST be Constraint instances. The order of the list MUST be preserved. The andSequence operator is an example where there may be temporal conditional requirements between the operands. This may lead to situations where the outcome is unresolvable, such as deadlock if one of the Constraints is unable to be satisfied. ODRL Processing systems SHOULD plan for these scenarios and implement mechanisms to resolve them. Holds the IRI of each resource it refers to, which ODRL leaves unconstrained."
        "reference": "http://www.w3.org/ns/odrl/2/andSequence"
        "extensions":
          "custom":
            "iri": "http://www.w3.org/ns/odrl/2/andSequence"
            "subPropertyOf":
              - "operand"
      "operand":
        "type": "LIST<STRING>"
        "name": "operand"
        "description": "Operand is an abstract property for a logical relationship. Sub-properties of operand are used for Logical Constraints. Holds the IRI of each resource it refers to, which ODRL leaves unconstrained."
        "reference": "http://www.w3.org/ns/odrl/2/operand"
        "extensions":
          "custom":
            "iri": "http://www.w3.org/ns/odrl/2/operand"
      "or":
        "type": "LIST<STRING>"
        "name": "or"
        "description": "The relation is satisfied when at least one of the Constraints is satisfied. This property MUST only be used for Logical Constraints, and the list of operand values MUST be Constraint instances. Holds the IRI of each resource it refers to, which ODRL leaves unconstrained."
        "reference": "http://www.w3.org/ns/odrl/2/or"
        "extensions":
          "custom":
            "iri": "http://www.w3.org/ns/odrl/2/or"
            "subPropertyOf":
              - "operand"
      "uid":
        "type": "LIST<STRING>"
        "name": "uid"
        "description": "An unambiguous identifier. Used by the Policy, Rule, Asset, Party, Constraint, and Logical Constraint Classes. Holds the IRI of each resource it refers to, which ODRL leaves unconstrained."
        "reference": "http://www.w3.org/ns/odrl/2/uid"
        "extensions":
          "custom":
            "iri": "http://www.w3.org/ns/odrl/2/uid"
            "unionEnds": true
      "xone":
        "type": "LIST<STRING>"
        "name": "xone"
        "description": "The relation is satisfied when only one, and not more, of the Constaints is satisfied. This property MUST only be used for Logical Constraints, and the list of operand values MUST be Constraint instances. Holds the IRI of each resource it refers to, which ODRL leaves unconstrained."
        "reference": "http://www.w3.org/ns/odrl/2/xone"
        "extensions":
          "custom":
            "iri": "http://www.w3.org/ns/odrl/2/xone"
            "subPropertyOf":
              - "operand"
    "constraints":
      "key_LogicalConstraint":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_LogicalConstraint_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/ns/odrl/2/LogicalConstraint"
        "area": "Constraints and operands"
  "Offer":
    "labels":
      "identifier": "Offer"
      "implied":
        - "Policy"
    "description": "A Policy that proposes a Rule over an Asset from an assigner. An Offer Policy MUST contain at least one Permission or Prohibition rule and a Party with Assigner function (in the same Permission or Prohibition). The Offer Policy MAY contain a Party with Assignee function, but MUST not grant any privileges to that Party."
    "reference": "http://www.w3.org/ns/odrl/2/Offer"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Offer individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
    "constraints":
      "key_Offer":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Offer_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/ns/odrl/2/Offer"
        "area": "Policies and rules"
        "disjointWith":
          - "Agreement"
          - "Assertion"
          - "Privacy"
          - "Request"
          - "Ticket"
  "Operator":
    "labels":
      "identifier": "Operator"
      "implied":
        - "Thing"
    "description": "Operator for constraint expression. Instances of the Operator class representing relational operators."
    "reference": "http://www.w3.org/ns/odrl/2/Operator"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Operator individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
    "constraints":
      "key_Operator":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Operator_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/ns/odrl/2/Operator"
        "area": "Constraints and operands"
  "Party":
    "labels":
      "identifier": "Party"
      "implied":
        - "Thing"
    "description": "An entity or a collection of entities that undertake Roles in a Rule. The Party entity could be a person, group of people, organisation, or agent. An agent is a person or thing that takes an active role or produces a specified effect. To describe more details about the Party, it is recommended to use W3C vCard Ontology [[vcard-rdf]] or FOAF Vocabulary [[foaf]]. Specialises schema:Person and schema:Organization and foaf:Person and foaf:Organization and foaf:Agent and vcard:Individual and vcard:Organization and vcard:Agent."
    "reference": "http://www.w3.org/ns/odrl/2/Party"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Party individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
      "uid":
        "type": "LIST<STRING>"
        "name": "uid"
        "description": "An unambiguous identifier. Used by the Policy, Rule, Asset, Party, Constraint, and Logical Constraint Classes. Holds the IRI of each resource it refers to, which ODRL leaves unconstrained."
        "reference": "http://www.w3.org/ns/odrl/2/uid"
        "extensions":
          "custom":
            "iri": "http://www.w3.org/ns/odrl/2/uid"
            "unionEnds": true
    "constraints":
      "key_Party":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Party_key"
    "extensions":
      "custom":
        "iri": "http://www.w3.org/ns/odrl/2/Party"
        "area": "Assets and parties"
        "subClassOf":
          - "schema:Person"
          - "schema:Organization"
          - "foaf:Person"
          - "foaf:Organization"
          - "foaf:Agent"
          - "vcard:Individual"
          - "vcard:Organization"
          - "vcard:Agent"
  "PartyCollection":
    "labels":
      "identifier": "PartyCollection"
      "implied":
        - "Party"
    "description": "A Party that is a group of individual entities."
    "reference": "http://www.w3.org/ns/odrl/2/PartyCollection"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the PartyCollection individual: its IRI in ODRL data. Unique within a data set; individuals that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
      "source":
        "type": "LIST<STRING>"
        "name": "source"
