  "Expression_CHANGES_Expression":
    "type": "CHANGES"
    "from":
      "node": "Expression"
    "to":
      "node": "Expression"
    "description": "Indicates that this work or expression legally changes another. This encompasses the notions of amendment, replacement, repeal, or other types of change. This may be a direct change (textual or non-textual amendment) or a consequential or indirect change. Note, the property is to be used to express the existence of a change relationship between two acts rather than the existence of a consolidated version of the text that shows the result of the change. For consolidation relationships, use the \"consolidates\" and \"consolidated_by\" properties. The inverse ELI property is 'changed_by'."
    "reference": "http://data.europa.eu/eli/ontology#changes"
    "extensions":
      "custom":
        "iri": "http://data.europa.eu/eli/ontology#changes"
        "specificPropertyOf":
          - "dcterms:relation"
        "inverseOf": "changed_by"
        "unionEnds": true
