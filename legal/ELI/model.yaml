  "Format_LEGAL_VALUE_LegalValue":
    "type": "LEGAL_VALUE"
    "from":
      "node": "Format"
      "max_count": 1
    "to":
      "node": "LegalValue"
    "description": "The legal value associated with a specific format of a resource. A set of values is defined by ELI in the corresponding concept scheme. These values are : - unofficial : no particular or special standing; - official : published by an organisation with the public task of making the information available (e.g. a consolidated version of a EU directive) ; - authoritative : the publisher gives some special status to the publication (e.g. \"the Queens Printer\" version of an Act of Parliament, or the OJ version of a EU Directive); - definitive : the text is conclusively what the law says, (e.g. the digitally signed version of an OJ). See also eli:LegalValue-authoritative, eli:LegalValue-definitive, eli:LegalValue-official, eli:LegalValue-unofficial, eli:LegalValueTable."
    "reference": "http://data.europa.eu/eli/ontology#legal_value"
    "extensions":
      "custom":
        "iri": "http://data.europa.eu/eli/ontology#legal_value"
        "functional": true
  "LegalResource_PASSED_BY_Agent":
    "type": "PASSED_BY"
    "from":
      "node": "LegalResource"
    "to":
      "node": "Agent"
    "description": "The person or organization that originally passed or made the law : typically parliament (for primary legislation) or government (for secondary legislation). This indicates the \"legal author\" of the law, as opposed to its physical author. This property can be used multiple times to indicate both the agent that authored the text, and/or the agent that signed the text, thus turning it into an actual legislation. The relationship between current and any former law making body should be represented in the description of the agent itself. Member states are encouraged to make their own list of Agents. EU Publications Office provides a list of corporate bodies at https://op.europa.eu/en/web/eu-vocabularies/at-dataset/-/resource/dataset/corporate-body."
    "reference": "http://data.europa.eu/eli/ontology#passed_by"
    "extensions":
