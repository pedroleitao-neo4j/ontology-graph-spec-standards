  "LegalExpression_APPLIES_LegalResource":
    "type": "APPLIES"
    "from":
      "node": "LegalExpression"
    "to":
      "node": "LegalResource"
    "description": "Indicates that this legislation (or part of a legislation) somehow conforms with another legislation. This is an informative link, and it has no legal value. For legally-binding links of transposition, use the property transposes. This can be used for example : - when a pre-existing law already conforms to a recent european directive (in that case it does not \"transposes\" it strictly speaking); - when non-EU member states make sure their legislation is conformant with EU law without strictly speaking transposing it; - when a legislation from a local authority conforms with a national legislation; Note that this should point to a LegalResource, not to a language-specific expression. The inverse ELI property is 'applied_by'. See also eli:transposes."
    "reference": "http://data.europa.eu/eli/ontology#applies"
    "extensions":
      "custom":
        "iri": "http://data.europa.eu/eli/ontology#applies"
        "specificPropertyOf":
          - "dcterms:relation"
        "inverseOf": "applied_by"
        "unionEnds": true
  "LegalResource_APPLIES_LegalResource":
