        "type": "LIST<STRING>"
        "name": "id_local"
        "description": "The unique identifier used in a local reference system to maintain backwards compatibility. For examples the CELEX at EU level, or the NOR in France."
        "reference": "http://data.europa.eu/eli/ontology#id_local"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#id_local"
            "specificPropertyOf":
              - "dcterms:identifier"
            "datatypes":
              - "xsd:anyURI"
              - "xsd:string"
            "unionEnds": true
      "number":
        "type": "LIST<STRING>"
        "name": "number"
        "description": "An identifier or other disambiguating feature for a legal resource or legal expression. This can be the number of a legislation, the number of an article, or the issue number of an official journal."
        "reference": "http://data.europa.eu/eli/ontology#number"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#number"
            "datatypes":
              - "xsd:string"
            "unionEnds": true
      "responsibility_of":
        "type": "LIST<STRING>"
        "name": "responsibility_of"
        "description": "An individual, organisation or organisational unit that has some kind of responsibility for the legislation. Typically the ministry who is/was in charge of elaborating the legislation, or the adressee for potential questions about the legislation once it is published. This property should be used when the value cannot be identified by a suitable URI; if a URI is available, the property \"responsibility_of_agent\" should be used. See also eli:responsibility_of_agent."
        "reference": "http://data.europa.eu/eli/ontology#responsibility_of"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#responsibility_of"
            "originalName": "service"
            "datatypes":
              - "xsd:string"
      "version_date":
        "type": "DATE"
