  "LegalExpression_ENSURES_IMPLEMENTATION_OF_LegalResource":
    "type": "ENSURES_IMPLEMENTATION_OF"
    "from":
      "node": "LegalExpression"
    "to":
      "node": "LegalResource"
    "description": "Indicates that this LegalResource ensures the implementation of another LegalResource. This implies a legal meaning (contrary to eli:applies). This can cover links from national legislation to EU legislation, or links from regional to national legislation. It can also cover links from EU implementing acts to EU legislative acts. In the case of implementation of EU legislation at national level, this covers links to EU regulations, decisions, etc. However the transpositions of EU Directives must be captured with eli:transposes. Links between national primary and secondary legislation must be captured by eli:based_on / eli:basis_for. The inverse ELI property is 'implementation_ensured_by'. See also eli:transposes."
    "reference": "http://data.europa.eu/eli/ontology#ensures_implementation_of"
    "extensions":
      "custom":
        "iri": "http://data.europa.eu/eli/ontology#ensures_implementation_of"
        "subPropertyOf":
          - "applies"
        "inverseOf": "implementation_ensured_by"
        "unionEnds": true
  "LegalResource_ENSURES_IMPLEMENTATION_OF_LegalResource":
    "type": "ENSURES_IMPLEMENTATION_OF"
    "from":
      "node": "LegalResource"
    "to":
      "node": "LegalResource"
    "description": "Indicates that this LegalResource ensures the implementation of another LegalResource. This implies a legal meaning (contrary to eli:applies). This can cover links from national legislation to EU legislation, or links from regional to national legislation. It can also cover links from EU implementing acts to EU legislative acts. In the case of implementation of EU legislation at national level, this covers links to EU regulations, decisions, etc. However the transpositions of EU Directives must be captured with eli:transposes. Links between national primary and secondary legislation must be captured by eli:based_on / eli:basis_for. The inverse ELI property is 'implementation_ensured_by'. See also eli:transposes."
    "reference": "http://data.europa.eu/eli/ontology#ensures_implementation_of"
    "extensions":
      "custom":
        "iri": "http://data.europa.eu/eli/ontology#ensures_implementation_of"
        "subPropertyOf":
          - "applies"
        "inverseOf": "implementation_ensured_by"
        "unionEnds": true
  "Manifestation_FORMAT_FormatType":
    "type": "FORMAT"
    "from":
      "node": "Manifestation"
    "to":
      "node": "FormatType"
    "description": "The format of the manifestation, expressed as a custom URI. This field is intended to capture the format of the resource from an application or user perspective, as opposed to the \"media_type\" property that expresses its format from a technical point of view. This property allows to describe different XML schemas (Akoma N'toso vs. proprietary), describe different types of PDFs (scanned PDF, generated-on-the-fly PDF, signed PDF, archival PDF) or describe the paper (printed) version of the legislation. ELI includes a set of possible values for the most common use-cases and possible URIs values CAN also be taken from http://www.iana.org/assignments/media-types , or can de defined by the Member States. See also eli:media_type."
    "reference": "http://data.europa.eu/eli/ontology#format"
    "extensions":
      "custom":
        "iri": "http://data.europa.eu/eli/ontology#format"
        "specificPropertyOf":
          - "dcterms:format"
