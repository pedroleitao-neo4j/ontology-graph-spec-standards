        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#description"
            "specificPropertyOf":
              - "dcterms:description"
            "datatypes":
              - "rdfs:Literal"
            "unionEnds": true
      "first_date_entry_in_force":
        "type": "DATE"
        "name": "first_date_entry_in_force"
        "description": "The first date any part of the legal resource or legal expression came into force (can be seen as the start date of a dc:valid range for this resource). See also eli:date_no_longer_in_force."
