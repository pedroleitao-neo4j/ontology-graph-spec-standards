"schema": "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json"
"version": "1.4"
"id": "eli-1.4"
"name": "ELI 1.4"
"description": "The European Legislation Identifier (ELI) ontology 1.4, published by the Publications Office of the European Union (https://op.europa.eu/en/web/eu-vocabularies/eli). ELI is the EU's framework for identifying legislation with persistent URIs and describing it with shared metadata, adopted by the Council conclusions of 2012 and used by the EU institutions and Member States to publish legislation as linked data. Built on the FRBR model, it describes legal resources (acts and their subdivisions, e.g. articles) as works; their versions in a language and at a point in time as legal expressions; and their published files as formats. Between them run the relations of the legislative corpus: amendment, repeal, consolidation, transposition, citation and so on; and from them the agents that pass and publish them and the authority-table concepts that classify them. Generated from the ELI 1.4 OWL file: each ELI class is a node, each object property a relationship from its domain to its range (one direction per inverse pair), each datatype property a property, and each superclass an implied label."
"nodes":
  "Expression":
    "labels":
      "identifier": "Expression"
    "description": "The intellectual realisation of a Work in the form of identifiable immaterial objects, such as, but not limited to, text. The substance of Expression is signs. An Expression cannot exist without a physical carrier but do not depend on a specific physical carrier and can exist on one or more carriers simultaneously."
    "reference": "http://data.europa.eu/eli/ontology#Expression"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Expression: its IRI. For a legal resource or expression, its ELI, e.g. http://data.europa.eu/eli/reg/2016/679/oj. Unique within a data set; resources that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
      "title":
        "type": "LIST<STRING>"
        "name": "title"
        "description": "The title, or name, of an expression. Note that, if needed, a title can also be stated on a legal resource using the Dublin Core \"title\" property. See also eli:title_alternative, eli:title_short."
        "reference": "http://data.europa.eu/eli/ontology#title"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#title"
            "specificPropertyOf":
              - "dcterms:title"
            "datatypes":
              - "rdfs:Literal"
      "title_alternative":
        "type": "LIST<STRING>"
        "name": "title_alternative"
        "description": "An alternative title of the expression (if any). Note that, if needed, an alternative title can also be stated on a work using the Dublin Core \"alternative\" property."
        "reference": "http://data.europa.eu/eli/ontology#title_alternative"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#title_alternative"
            "specificPropertyOf":
              - "dcterms:alternative"
            "datatypes":
              - "rdfs:Literal"
      "title_short":
        "type": "LIST<STRING>"
        "name": "title_short"
        "description": "Established short title of the expression (if any)."
        "reference": "http://data.europa.eu/eli/ontology#title_short"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#title_short"
            "specificPropertyOf":
              - "dcterms:alternative"
            "datatypes":
              - "rdfs:Literal"
    "constraints":
      "key_Expression":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Expression_key"
    "extensions":
      "custom":
        "iri": "http://data.europa.eu/eli/ontology#Expression"
        "level": "Expression"
        "subClassOf":
          - "frbroo:F22_Self-Contained_Expression"
        "versionInfo":
          - "created in v1.3"
  "Work":
    "labels":
      "identifier": "Work"
    "description": "Any distinct intellectual creation (i.e., the intellectual content), in the context of ELI. The substance of Work is ideas."
    "reference": "http://data.europa.eu/eli/ontology#Work"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Work: its IRI. For a legal resource or expression, its ELI, e.g. http://data.europa.eu/eli/reg/2016/679/oj. Unique within a data set; resources that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
      "date_document":
        "type": "DATE"
        "name": "date_document"
        "description": "Date of adoption or signature (of the form yyyy-mm-dd)."
        "reference": "http://data.europa.eu/eli/ontology#date_document"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#date_document"
            "specificPropertyOf":
              - "dcterms:date"
            "functional": true
            "datatypes":
              - "xsd:date"
    "constraints":
      "key_Work":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Work_key"
    "extensions":
      "custom":
        "iri": "http://data.europa.eu/eli/ontology#Work"
        "level": "Work"
        "subClassOf":
          - "frbroo:F1_Work"
        "versionInfo":
          - "created in v1.3"
  "LegalExpression":
    "labels":
      "identifier": "LegalExpression"
      "implied":
        - "Expression"
    "description": "The intellectual realisation of a legal resource in the form of a \"sequence of signs\" (typically alpha-numeric characters in a legal context). For example, any version of the legal resource whose content is specified and different from others for any reason: language, versions, etc.; Note that ELI ontology accommodates different point of view on what should be considered a new legal resource, or a new legal expression of the same resource. Typically, a consolidated version can be viewed, in the context of ELI, either as separate legal resource (linked to original version and previous consolidated version using corresponding ELI relations), or as a different legal expression of the same legal resource."
    "reference": "http://data.europa.eu/eli/ontology#LegalExpression"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the LegalExpression: its IRI. For a legal resource or expression, its ELI, e.g. http://data.europa.eu/eli/reg/2016/679/oj. Unique within a data set; resources that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
      "cites":
        "type": "LIST<STRING>"
        "name": "cites"
        "description": "Citation in the text of the legislation. This may be at the legal resource or legal expression level, as required by the implementation context. This includes verbatim citation and citations in referrals. Holds the IRI of each resource it refers to, which ELI allows to be anything, not only an ELI resource. The inverse ELI property is 'cited_by'."
        "reference": "http://data.europa.eu/eli/ontology#cites"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#cites"
            "specificPropertyOf":
              - "dcterms:relation"
            "inverseOf": "cited_by"
            "unionEnds": true
      "cited_by_case_law":
        "type": "LIST<STRING>"
        "name": "cited_by_case_law"
        "description": "Indicates that this LegalResource or LegalExpression is being cited in a case law, identified by a suitable URI. If the case law cannot be identified by a suitable URI, the property \"eli:cited_by_case_law_reference\" can be used with a textual reference to the case law. The actual citation link is expressed from the case law to the legislation, but legal portals may use the link from a legislation to a case law to e.g. refer to representative case laws about a legislation. Holds the IRI of each resource it refers to, which ELI allows to be anything, not only an ELI resource. See also eli:cited_by_case_law_reference."
        "reference": "http://data.europa.eu/eli/ontology#cited_by_case_law"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#cited_by_case_law"
            "specificPropertyOf":
              - "dcterms:relation"
            "unionEnds": true
      "related_to":
        "type": "LIST<STRING>"
        "name": "related_to"
        "description": "Indicates a somehow related other document, not necessarily a legal resource. Note that citation links should use the cites property. Holds the IRI of each resource it refers to, which ELI allows to be anything, not only an ELI resource."
        "reference": "http://data.europa.eu/eli/ontology#related_to"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#related_to"
            "specificPropertyOf":
              - "dcterms:relation"
            "unionEnds": true
      "uri_schema":
        "type": "STRING"
        "name": "uri_schema"
        "description": "Schema describing the URI of an ELI instance. ELI uses URI template specifications (IETF RFC 6570). Schemes should be associated with member states and will be published in a registry. Holds the IRI of the resource it refers to, which ELI allows to be anything, not only an ELI resource."
        "reference": "http://data.europa.eu/eli/ontology#uri_schema"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#uri_schema"
            "functional": true
            "unionEnds": true
      "cited_by_case_law_reference":
        "type": "LIST<STRING>"
        "name": "cited_by_case_law_reference"
        "description": "Indicates that this LegalResource or LegalExpression is being cited in a case law that cannot be identified by a suitable URI and that is indicated by textual reference. An ECLI (European Case Law Identifier) can be used here. When the case law can be identified by a suitable URI, the property eli:cited_by_case_law should be used instead. See also eli:cited_by_case_law."
        "reference": "http://data.europa.eu/eli/ontology#cited_by_case_law_reference"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#cited_by_case_law_reference"
            "specificPropertyOf":
              - "dcterms:relation"
            "datatypes":
              - "rdfs:Literal"
            "unionEnds": true
      "date_applicability":
        "type": "LIST<DATE>"
        "name": "date_applicability"
        "description": "The date at which the legislation becomes applicable. This is distinct from the date of entry into force : a text may come in force today, and state it will become applicable in 3 months. The group notes that applicability dates can lead to complex situations, e.g. a text with different applicability dates for different jurisdictions; specific extensions to the model should be used for such situations."
        "reference": "http://data.europa.eu/eli/ontology#date_applicability"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#date_applicability"
            "datatypes":
              - "xsd:date"
            "unionEnds": true
      "date_no_longer_in_force":
        "type": "DATE"
        "name": "date_no_longer_in_force"
        "description": "The last date any part of the legislation is in force, if the date is known (can be seen as the end date of a dc:valid range for this resource). See also eli:first_date_entry_in_force."
        "reference": "http://data.europa.eu/eli/ontology#date_no_longer_in_force"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#date_no_longer_in_force"
            "functional": true
            "datatypes":
              - "xsd:date"
            "unionEnds": true
      "date_publication":
        "type": "DATE"
        "name": "date_publication"
        "description": "Date of publication of the official version of the legislation, in hard copy or online, depending on what the official publication is, and when it was published. Publication dates at the level of legal expressions can be separately asserted, using standard Dublin Core properties."
        "reference": "http://data.europa.eu/eli/ontology#date_publication"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#date_publication"
            "specificPropertyOf":
              - "dcterms:issued"
            "functional": true
            "datatypes":
              - "xsd:date"
            "unionEnds": true
      "description":
        "type": "LIST<STRING>"
        "name": "description"
        "description": "An account of the resource (definition from Dubin Core), e.g a summary."
        "reference": "http://data.europa.eu/eli/ontology#description"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#description"
            "specificPropertyOf":
              - "dcterms:description"
            "datatypes":
              - "rdfs:Literal"
            "unionEnds": true
      "first_date_entry_in_force":
        "type": "DATE"
        "name": "first_date_entry_in_force"
        "description": "The first date any part of the legal resource or legal expression came into force (can be seen as the start date of a dc:valid range for this resource). See also eli:date_no_longer_in_force."
        "reference": "http://data.europa.eu/eli/ontology#first_date_entry_in_force"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#first_date_entry_in_force"
            "functional": true
            "datatypes":
              - "xsd:date"
            "unionEnds": true
      "id_local":
        "type": "LIST<STRING>"
        "name": "id_local"
        "description": "The unique identifier used in a local reference system to maintain backwards compatibility. For examples the CELEX at EU level, or the NOR in France."
        "reference": "http://data.europa.eu/eli/ontology#id_local"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#id_local"
            "specificPropertyOf":
              - "dcterms:identifier"
            "datatypes":
              - "xsd:anyURI"
              - "xsd:string"
            "unionEnds": true
      "number":
        "type": "LIST<STRING>"
        "name": "number"
        "description": "An identifier or other disambiguating feature for a legal resource or legal expression. This can be the number of a legislation, the number of an article, or the issue number of an official journal."
        "reference": "http://data.europa.eu/eli/ontology#number"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#number"
            "datatypes":
              - "xsd:string"
            "unionEnds": true
      "publisher":
        "type": "LIST<STRING>"
        "name": "publisher"
        "description": "An entity responsible for making the resource available (definition from Dublin Core). This property should be used when the value cannot be identified by a suitable URI; if a URI is available, the property \"publisher_agent\" should be used. See also eli:publisher_agent."
        "reference": "http://data.europa.eu/eli/ontology#publisher"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#publisher"
            "specificPropertyOf":
              - "dcterms:publisher"
            "datatypes":
              - "rdfs:Literal"
            "unionEnds": true
      "version_date":
        "type": "DATE"
        "name": "version_date"
        "description": "The point-in-time at which the provided description of the legislation is valid."
        "reference": "http://data.europa.eu/eli/ontology#version_date"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#version_date"
            "specificPropertyOf":
              - "dcterms:date"
            "functional": true
            "datatypes":
              - "xsd:date"
            "unionEnds": true
    "constraints":
      "key_LegalExpression":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_LegalExpression_key"
    "extensions":
      "custom":
        "iri": "http://data.europa.eu/eli/ontology#LegalExpression"
        "level": "Expression"
        "versionInfo":
          - "created in v1.0"
          - "modified in v1.3"
  "LegalResource":
    "labels":
      "identifier": "LegalResource"
      "implied":
        - "Work"
