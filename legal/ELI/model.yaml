  "LegalResource_IS_ANOTHER_PUBLICATION_OF_LegalResource":
    "type": "IS_ANOTHER_PUBLICATION_OF"
    "from":
      "node": "LegalResource"
    "to":
      "node": "LegalResource"
    "description": "Indicates that this resource is a new publication, in a different official journal, of another resource already published elsewhere, and cannot be considered to be the same resource (owl:sameAs cannot be used to avoid potential duplication of certain metadata, like the date of publication, or the publisher). Note that this is different from the exceptionnal cases of \"republication\", where the same resource is actually republished in the same official journal a few days after its initial publication, in case of errors. The inverse ELI property is 'has_another_publication'."
