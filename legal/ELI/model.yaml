    "description": "Indicates that this legislation (or part of legislation) fulfills the objectives set by another legislation, by passing appropriate implementation measures. Typically, some legislations of European Union's member states or regions transpose European Directives. This indicates a legally binding link between the 2 legislations, at act or article level, from the original version of a national implementing measure to the legal resource Directive as published in the EU Official Journal. Can be used for transposition tables, once EU Publication Office has introduced ELI support down to the article level. The implementation of EU legislation at national level, involving links to EU regulations, decisions, etc. must be captured with eli:ensures_implementation_of. Note that this should point to the legal resource of the Directive itself, not to one of its language-specific legal expression. The inverse ELI property is 'transposed_by'. See also eli:ensures_implementation_of."
    "reference": "http://data.europa.eu/eli/ontology#transposes"
    "extensions":
      "custom":
        "iri": "http://data.europa.eu/eli/ontology#transposes"
        "subPropertyOf":
          - "applies"
        "inverseOf": "transposed_by"
        "unionEnds": true
