        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Format_key"
    "extensions":
      "custom":
        "iri": "http://data.europa.eu/eli/ontology#Format"
        "level": "Manifestation"
        "versionInfo":
          - "created in v1.0"
          - "modified in v1.3"
