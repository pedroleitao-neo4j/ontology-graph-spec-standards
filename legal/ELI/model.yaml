  "LegalExpression_IS_TRANSLATION_OF_LegalExpression":
    "type": "IS_TRANSLATION_OF"
    "from":
      "node": "LegalExpression"
    "to":
      "node": "LegalExpression"
    "description": "Indicates that this expression has been translated from another original expression; this can be used to distinguish original from derived expressions. Note that asserting this link does not have any implication on the legal value of the original and translated expressions : depending on the context, a translation can be as legally binding as the original version, or can be published for informative purposes only (e.g. a country translating some legal acts in English). The expressions linked with this property can be realisations of the same LegalResource, or different LegalResources. Multilingual legislations that do not need to distinguish between original and derived expressions of the same LegalResource (e.g. european legislation) will not use this property. The inverse ELI property is 'has_translation'."
    "reference": "http://data.europa.eu/eli/ontology#is_translation_of"
    "extensions":
      "custom":
        "iri": "http://data.europa.eu/eli/ontology#is_translation_of"
        "inverseOf": "has_translation"
