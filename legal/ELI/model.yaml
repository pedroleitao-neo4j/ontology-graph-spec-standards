  "Format_FORMAT_FormatType":
    "type": "FORMAT"
    "from":
      "node": "Format"
      "count": 1
    "to":
      "node": "FormatType"
    "description": "Every Format has exactly one 'format', a FormatType. The format of the manifestation, expressed as a custom URI. This field is intended to capture the format of the resource from an application or user perspective, as opposed to the \"media_type\" property that expresses its format from a technical point of view. This property allows to describe different XML schemas (Akoma N'toso vs. proprietary), describe different types of PDFs (scanned PDF, generated-on-the-fly PDF, signed PDF, archival PDF) or describe the paper (printed) version of the legislation. ELI includes a set of possible values for the most common use-cases and possible URIs values CAN also be taken from http://www.iana.org/assignments/media-types , or can de defined by the Member States."
    "reference": "http://data.europa.eu/eli/ontology#format"
    "extensions":
      "custom":
        "iri": "http://data.europa.eu/eli/ontology#format"
        "specificPropertyOf":
          - "dcterms:format"
        "restriction": "cardinality 1"
