  "LegalResource_COUNTERSIGNED_BY_Agent":
    "type": "COUNTERSIGNED_BY"
    "from":
      "node": "LegalResource"
    "to":
      "node": "Agent"
    "description": "A person or organization that countersigned the legislation. Depending on the legal context, a countersignature can indicate that the signed authority undertakes to assume responsibility for texts emanating from a person who is inviolable and irresponsible, (for example a King, Grand Duc or President), or that the authority is in charge of the implementation of the text."
