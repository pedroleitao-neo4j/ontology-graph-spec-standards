      "node": "Format"
    "to":
      "node": "Format"
    "description": "Reference to the Official Journal or other publication manifestation in which this format is published. This property should be used when the value can be identified by a suitable URI; in the absence of such a URI, the property \"published_in\" should be used with a string value. The inverse ELI property is 'publishes'. See also eli:published_in."
