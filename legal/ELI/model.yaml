  "Manifestation":
    "labels":
      "identifier": "Manifestation"
    "description": "The physical embodiment of an Expression, either on paper or in any electronic format. The substance of Manifestation is not only signs, but also the manner in which they are presented to be consumed by users, including the kind of media adopted."
    "reference": "http://data.europa.eu/eli/ontology#Manifestation"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Manifestation: its IRI. Unique within a data set; resources that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
      "is_exemplified_by":
        "type": "LIST<STRING>"
        "name": "is_exemplified_by"
        "description": "Link to a concrete file URL. Relates a manifestation to a single exemplar or instance of that manifestation. Holds the IRI of each resource it refers to, which ELI allows to be anything."
        "reference": "http://data.europa.eu/eli/ontology#is_exemplified_by"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#is_exemplified_by"
            "subPropertyOf":
              - "frbroo:R7i_has_example"
      "media_type":
        "type": "LIST<STRING>"
        "name": "media_type"
        "description": "The file format of the manifestation. This field is intended to capture the technical file format and will serve as a basis for content negotiation for the server to return the appropriate file based on the client preference. Although not mandatory, this property is highly encouraged. Possible URIs values MUST be taken from http://www.iana.org/assignments/media-types (e.g. http://www.iana.org/assignments/media-types/application/xml). See also the \"format\" property. Holds the IRI of each resource it refers to, which ELI allows to be anything, not only an ELI resource. See also eli:format."
        "reference": "http://data.europa.eu/eli/ontology#media_type"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#media_type"
            "specificPropertyOf":
              - "dcterms:format"
    "constraints":
      "key_Manifestation":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "uri_Manifestation_key"
    "extensions":
      "custom":
        "iri": "http://data.europa.eu/eli/ontology#Manifestation"
        "level": "Manifestation"
        "subClassOf":
          - "frbroo:F3_Manifestation_Product_Type"
        "versionInfo":
          - "created v1.3"
  "Format":
    "labels":
      "identifier": "Format"
      "implied":
        - "Manifestation"
    "description": "The physical embodiment of a legal expression, either on paper or in any electronic format. For example, any electronic or physical format of the legal expression (XML, TIFF, PDF, etc.) ; e.g. PDF version of act 3 of 2005. (adapted from Akoma Ntoso). Note that the notion of Format in ELI is more precise than a FRBR Manifestation in the sense that a Format in ELI can carry a legal value (see the property eli:legal_value)."
    "reference": "http://data.europa.eu/eli/ontology#Format"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The identifier of the Format: its IRI. Unique within a data set; resources that are blank nodes are given generated identifiers."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
      "licence":
        "type": "STRING"
        "name": "licence"
        "description": "A legal document giving official permission to do something with the resource (Definition from Dublin Core). Holds the IRI of the resource it refers to, which ELI allows to be anything, not only an ELI resource."
        "reference": "http://data.europa.eu/eli/ontology#licence"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#licence"
            "specificPropertyOf":
              - "dcterms:license"
            "functional": true
      "uri_schema":
        "type": "STRING"
        "name": "uri_schema"
        "description": "Schema describing the URI of an ELI instance. ELI uses URI template specifications (IETF RFC 6570). Schemes should be associated with member states and will be published in a registry. Holds the IRI of the resource it refers to, which ELI allows to be anything, not only an ELI resource."
        "reference": "http://data.europa.eu/eli/ontology#uri_schema"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#uri_schema"
            "functional": true
            "unionEnds": true
      "id_local":
        "type": "LIST<STRING>"
        "name": "id_local"
        "description": "The unique identifier used in a local reference system to maintain backwards compatibility. For examples the CELEX at EU level, or the NOR in France."
        "reference": "http://data.europa.eu/eli/ontology#id_local"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#id_local"
            "specificPropertyOf":
              - "dcterms:identifier"
            "datatypes":
              - "xsd:anyURI"
              - "xsd:string"
            "unionEnds": true
      "published_in":
        "type": "LIST<STRING>"
        "name": "published_in"
        "description": "Reference to the Official Journal or other publication manifestation in which this format is published. This property should be used when the value cannot be identified by a suitable URI; if a URI is available, the property \"published_in_format\" should be used. See also eli:published_in_format."
        "reference": "http://data.europa.eu/eli/ontology#published_in"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#published_in"
            "datatypes":
              - "rdfs:Literal"
      "publisher":
        "type": "LIST<STRING>"
        "name": "publisher"
        "description": "An entity responsible for making the resource available (definition from Dublin Core). This property should be used when the value cannot be identified by a suitable URI; if a URI is available, the property \"publisher_agent\" should be used. See also eli:publisher_agent."
        "reference": "http://data.europa.eu/eli/ontology#publisher"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#publisher"
            "specificPropertyOf":
              - "dcterms:publisher"
            "datatypes":
              - "rdfs:Literal"
            "unionEnds": true
      "rights":
        "type": "STRING"
        "name": "rights"
        "description": "Information about rights held in and over the resource (definition from Dublin Core). For example, that property can be used to provide a link to a page that describes the licensing terms."
        "reference": "http://data.europa.eu/eli/ontology#rights"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#rights"
            "specificPropertyOf":
              - "dcterms:rights"
            "functional": true
            "datatypes":
              - "rdfs:Literal"
      "rightsholder":
        "type": "LIST<STRING>"
        "name": "rightsholder"
        "description": "A person or organisation owning or managing rights over the resource (definition from Dublin Core). This property should be used when the value cannot be identified by a suitable URI; if a URI is available, the property \"rightsholder_agent\" should be used."
        "reference": "http://data.europa.eu/eli/ontology#rightsholder"
        "extensions":
          "custom":
            "iri": "http://data.europa.eu/eli/ontology#rightsholder"
            "specificPropertyOf":
              - "dcterms:rightsHolder"
            "datatypes":
              - "rdfs:Literal"
