        "name": "uid"
        "description": "The identifier of the AssetAdministrationShell node in the graph, set by the loader: not part of the AAS metamodel. For an Identifiable, its id; for a Referable within one, e.g. a submodel element, the Identifiable's id followed by the element's idShort path; for any other element, e.g. a Reference or a Key, an identifier generated from its parent's uid and its position."
        "extensions":
          "custom":
