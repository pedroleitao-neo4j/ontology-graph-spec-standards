    "description": "aas:Reference skos:relatedMatch aml:Attribute. A reference-valued attribute of an AAS element, e.g. its semanticId, is an attribute whose value is the reference serialised as a string (AR 004E rule 6 and 6.2.6). The attribute's RefSemantic, e.g. AAS:HasSemantics/semanticId, names the metamodel attribute it holds, not the reference's meaning."
