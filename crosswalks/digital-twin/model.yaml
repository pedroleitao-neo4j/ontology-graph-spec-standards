"relationships":
  "aas__AssetAdministrationShell_SAME_AS_aml__InternalElement":
    "type": "SAME_AS"
    "from":
      "node": "aas__AssetAdministrationShell"
    "to":
      "node": "aml__InternalElement"
    "description": "aas:AssetAdministrationShell skos:closeMatch aml:InternalElement. An AAS is serialised as an internal element with the role class AssetAdministrationShellRoleClassLib/AssetAdministrationShell, named by its idShort (AR 004E rules 2, 14 and 16). Its id becomes the value of an AutomationML attribute, not the internal element's ID, which stays a UUID. Linked nodes share idShort and name."
    "reference": "https://www.automationml.org/wp-content/uploads/2022/04/Asset-Administration-Shell-Representation-V1_0_0.zip"
    "extensions":
      "custom":
        "predicate": "skos:closeMatch"
        "exact": false
        "properties":
          "idShort": "name"
  "aas__AssetInformation_SAME_AS_aml__InternalElement":
    "type": "SAME_AS"
    "from":
      "node": "aas__AssetInformation"
    "to":
      "node": "aml__InternalElement"
    "description": "aas:AssetInformation skos:closeMatch aml:InternalElement. The asset an AAS describes is an internal element with the role class AssetAdministrationShellRoleClassLib/Asset (AR 004E 5.1.2). The recommendation was written for AAS metamodel 2.0, where the asset was an identifiable of its own; in 3.x it is the shell's asset information, with no idShort to name the element by."
    "reference": "https://www.automationml.org/wp-content/uploads/2022/04/Asset-Administration-Shell-Representation-V1_0_0.zip"
    "extensions":
      "custom":
        "predicate": "skos:closeMatch"
        "exact": false
  "aas__Submodel_SAME_AS_aml__InternalElement":
    "type": "SAME_AS"
    "from":
      "node": "aas__Submodel"
    "to":
      "node": "aml__InternalElement"
    "description": "aas:Submodel skos:closeMatch aml:InternalElement. A submodel of kind Instance is an internal element with the role class AssetAdministrationShellRoleClassLib/Submodel, named by its idShort, inside the shell's internal element (AR 004E rules 2, 16 and 5.1.3). Linked nodes share idShort and name."
    "reference": "https://www.automationml.org/wp-content/uploads/2022/04/Asset-Administration-Shell-Representation-V1_0_0.zip"
    "extensions":
      "custom":
        "predicate": "skos:closeMatch"
        "exact": false
        "properties":
          "idShort": "name"
  "aas__Submodel_RELATED_TO_aml__SystemUnitClass":
    "type": "RELATED_TO"
    "from":
      "node": "aas__Submodel"
    "to":
      "node": "aml__SystemUnitClass"
    "description": "aas:Submodel skos:relatedMatch aml:SystemUnitClass. A submodel of kind Template, and the shell holding it, become system unit classes in a system unit class library, e.g. AssetAdministrationShellSystemUnitClasses, carrying the same roles as their instances (AR 004E rules 24 to 26)."
    "reference": "https://www.automationml.org/wp-content/uploads/2022/04/Asset-Administration-Shell-Representation-V1_0_0.zip"
    "extensions":
      "custom":
        "predicate": "skos:relatedMatch"
        "exact": false
  "aas__SubmodelElement_SAME_AS_aml__InternalElement":
    "type": "SAME_AS"
    "from":
      "node": "aas__SubmodelElement"
    "to":
      "node": "aml__InternalElement"
    "description": "aas:SubmodelElement skos:closeMatch aml:InternalElement. Every submodel element is an internal element whose role class is its subtype, e.g. AssetAdministrationShellRoleClassLib/Property, named by its idShort; a collection's elements are internal elements inside it (AR 004E rules 9 and 13). Linked nodes share idShort and name."
    "reference": "https://www.automationml.org/wp-content/uploads/2022/04/Asset-Administration-Shell-Representation-V1_0_0.zip"
    "extensions":
      "custom":
        "predicate": "skos:closeMatch"
        "exact": false
        "properties":
          "idShort": "name"
  "aas__File_RELATED_TO_aml__ExternalDataReference":
    "type": "RELATED_TO"
    "from":
      "node": "aas__File"
    "to":
      "node": "aml__ExternalDataReference"
    "description": "aas:File skos:relatedMatch aml:ExternalDataReference. A File element's internal element references its file through a FileDataReference interface, derived from ExternalDataReference, whose refURI and MIMEType attributes carry the file's path and content type (AR 004E rule 10 and 4.7)."
    "reference": "https://www.automationml.org/wp-content/uploads/2022/04/Asset-Administration-Shell-Representation-V1_0_0.zip"
    "extensions":
      "custom":
        "predicate": "skos:relatedMatch"
        "exact": false
  "aas__ReferenceElement_RELATED_TO_aml__InternalLink":
    "type": "RELATED_TO"
    "from":
      "node": "aas__ReferenceElement"
    "to":
      "node": "aml__InternalLink"
    "description": "aas:ReferenceElement skos:relatedMatch aml:InternalLink. A reference element pointing inside the AAS has a ReferableReference interface, joined by an internal link to the element it refers to; an external reference is a serialised string instead (AR 004E rule 11)."
    "reference": "https://www.automationml.org/wp-content/uploads/2022/04/Asset-Administration-Shell-Representation-V1_0_0.zip"
    "extensions":
      "custom":
        "predicate": "skos:relatedMatch"
        "exact": false
  "aas__RelationshipElement_RELATED_TO_aml__InternalLink":
    "type": "RELATED_TO"
    "from":
      "node": "aas__RelationshipElement"
    "to":
      "node": "aml__InternalLink"
    "description": "aas:RelationshipElement skos:relatedMatch aml:InternalLink. A relationship element's first and second elements are ReferableReference interfaces, each joined by an internal link to the element it refers to when that is inside the AAS (AR 004E rule 11)."
    "reference": "https://www.automationml.org/wp-content/uploads/2022/04/Asset-Administration-Shell-Representation-V1_0_0.zip"
    "extensions":
      "custom":
        "predicate": "skos:relatedMatch"
        "exact": false
  "aas__ConceptDescription_SAME_AS_aml__InternalElement":
    "type": "SAME_AS"
    "from":
      "node": "aas__ConceptDescription"
    "to":
      "node": "aml__InternalElement"
    "description": "aas:ConceptDescription skos:closeMatch aml:InternalElement. A concept description is an internal element with the role class AssetAdministrationShellRoleClassLib/ConceptDescription, in an instance hierarchy such as AssetAdministrationShellConceptDescriptions. Its name joins its idShort, ID type and ID, so the names don't match (AR 004E rules 15 and 20)."
    "reference": "https://www.automationml.org/wp-content/uploads/2022/04/Asset-Administration-Shell-Representation-V1_0_0.zip"
    "extensions":
      "custom":
        "predicate": "skos:closeMatch"
        "exact": false
  "aas__Qualifier_SAME_AS_aml__Attribute":
    "type": "SAME_AS"
    "from":
      "node": "aas__Qualifier"
    "to":
      "node": "aml__Attribute"
    "description": "aas:Qualifier skos:closeMatch aml:Attribute. A qualifier is a complex attribute named Qualifier:<type>=<value>, with the qualifier's own attributes as nested attributes (AR 004E rule 7)."
    "reference": "https://www.automationml.org/wp-content/uploads/2022/04/Asset-Administration-Shell-Representation-V1_0_0.zip"
    "extensions":
      "custom":
        "predicate": "skos:closeMatch"
