      "node": "aml__Attribute"
    "description": "aas:Property skos:closeMatch aml:Attribute. An AAS property can publish an AutomationML attribute of the element that holds the asset's engineering data, named as the attribute and holding its value; the recommendation relates them by a RelationshipElement in the AutomationML submodel, or by a property already in another submodel such as the Digital Nameplate (AR AMLinAAS 3.3). Linked nodes share idShort and name, value."
