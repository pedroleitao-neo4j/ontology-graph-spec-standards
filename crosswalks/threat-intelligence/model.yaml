  "d3fend__OffensiveTactic":
    "labels":
      "identifier": "d3fend__OffensiveTactic"
    "description": "Per ATT&CK, these are defined as Tactical Goals, not Tactics per se. Many children also fit definition of tactics. Some are neither tactics or tactical goals really (e.g., Execution, which is a useful grouping, but an action, not really a tactic or technique. Holds the 65 D3FEND classes under OffensiveTactic in D3FEND 1.6.0, e.g. Impact, Stealth, Discovery."
    "reference": "http://d3fend.mitre.org/ontologies/d3fend.owl#OffensiveTactic"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The IRI of the D3FEND class the node stands for, e.g. `http://d3fend.mitre.org/ontologies/d3fend.owl#AML.TA0000`. Unique within the knowledge base."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
      "framework":
        "type": "STRING"
        "name": "framework"
        "description": "The threat model the node comes from, by the D3FEND class it falls under, e.g. ATT&CK Enterprise for a class under ATTACKEnterpriseThing."
        "reference": "http://d3fend.mitre.org/ontologies/d3fend.owl#ExternalThreatModelThing"
        "one_of":
          - "ATLAS"
          - "ATT&CK Enterprise"
          - "ATT&CK ICS"
          - "ATT&CK Mobile"
          - "SPARTA"
      "name":
        "type": "STRING"
        "name": "name"
        "description": "The name of the class: its rdfs:label in D3FEND, e.g. `Search Open Technical Databases - ATLAS`. D3FEND gives 4 of them more than one; the first is kept."
        "reference": "http://www.w3.org/2000/01/rdf-schema#label"
        "extensions":
          "custom":
            "iri": "http://www.w3.org/2000/01/rdf-schema#label"
      "definition":
        "type": "STRING"
        "name": "definition"
        "description": "The definition of the class in D3FEND. D3FEND gives 1 of them more than one; the first is kept."
        "reference": "http://d3fend.mitre.org/ontologies/d3fend.owl#definition"
        "extensions":
          "custom":
            "iri": "http://d3fend.mitre.org/ontologies/d3fend.owl#definition"
