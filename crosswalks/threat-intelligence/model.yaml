  "attack__Tactic":
    "labels":
      "identifier": "attack__Tactic"
    "description": "A tactic: the 'why' of an attack, the adversary's tactical objective, e.g. Stealth or Privilege Escalation. Techniques serve a tactic through the technique's kill chain phases. Holds 39 Tactic objects in MITRE ATT&CK 20.1: Enterprise 15, Mobile 12, ICS 12. Examples: Initial Access, Execution, Persistence."
    "reference": "https://attack.mitre.org/tactics/"
    "properties":
      "stixId":
        "type": "STRING"
        "name": "stixId"
        "description": "The STIX identifier of the ATT&CK object, e.g. `attack-pattern--0042a9f5-f053-4769-b3ef-9ad018dfa298`. Unique across the domains."
        "reference": "https://docs.oasis-open.org/cti/stix/v2.1/os/stix-v2.1-os.html"
        "pattern": "^[a-z0-9-]+--[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      "attackId":
        "type": "STRING"
        "name": "attackId"
        "description": "The ATT&CK identifier of the object, matching `^TA\\d{4}$`, e.g. `T1055.011`."
        "reference": "https://attack.mitre.org/resources/attack-data-and-tools/"
        "pattern": "^TA\\d{4}$"
      "shortname":
        "type": "STRING"
        "name": "shortname"
        "description": "The tactic's short name, e.g. `privilege-escalation`, as used in a technique's kill chain phases."
        "reference": "https://attack.mitre.org/resources/attack-data-and-tools/"
      "name":
        "type": "STRING"
        "name": "name"
        "description": "The ATT&CK name of the object, e.g. `Spearphishing Attachment`."
        "reference": "https://attack.mitre.org/resources/attack-data-and-tools/"
      "description":
        "type": "STRING"
        "name": "description"
        "description": "The ATT&CK description of the object, as plain text."
        "reference": "https://attack.mitre.org/resources/attack-data-and-tools/"
      "url":
        "type": "STRING"
        "name": "url"
        "description": "The URL of the object on attack.mitre.org, e.g. `https://attack.mitre.org/techniques/T1566/001`."
        "reference": "https://attack.mitre.org/resources/attack-data-and-tools/"
      "created":
        "type": "ZONED DATETIME"
        "name": "created"
        "description": "When the ATT&CK object was created."
        "reference": "https://docs.oasis-open.org/cti/stix/v2.1/os/stix-v2.1-os.html"
      "modified":
        "type": "ZONED DATETIME"
        "name": "modified"
        "description": "When the ATT&CK object was last modified."
        "reference": "https://docs.oasis-open.org/cti/stix/v2.1/os/stix-v2.1-os.html"
      "domains":
        "type": "LIST<STRING>"
        "name": "domains"
        "description": "The ATT&CK domains the object belongs to: Enterprise, Mobile or ICS."
        "reference": "https://attack.mitre.org/resources/attack-data-and-tools/"
      "version":
        "type": "STRING"
        "name": "version"
        "description": "The ATT&CK version of the object, e.g. `1.2`, as it has changed over releases."
        "reference": "https://attack.mitre.org/resources/attack-data-and-tools/"
    "constraints":
      "key_Tactic":
        "type": "KEY"
        "properties":
          - "stixId"
        "name": "attack__stixId_Tactic_key"
    "extensions":
      "custom":
        "standard": "MITRE ATT&CK 20.1"
  "attack__Technique":
    "labels":
      "identifier": "attack__Technique"
    "description": "A technique: the 'how' of an attack, the means by which an adversary achieves a tactical objective. A sub-technique is a more specific technique, linked to its parent by SUBTECHNIQUE_OF. Holds 935 Technique objects in MITRE ATT&CK 20.1: Enterprise 706, Mobile 125, ICS 104. Examples: Activate Firmware Update Mode, Monitor Process State, Automated Collection."
