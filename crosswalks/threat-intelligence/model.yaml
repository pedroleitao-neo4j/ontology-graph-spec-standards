  "d3fend__Process":
    "labels":
      "identifier": "d3fend__Process"
      "implied":
        - "d3fend__DigitalArtifact"
    "description": "A process is an instance of a computer program that is being executed. It contains the program code and its current activity. Depending on the operating system (OS), a process may be made up of multiple threads of execution that execute instructions concurrently. A computer program is a passive collection of instructions, while a process is the actual execution of those instructions. Several processes may be associated with the same program; for example, opening up several instances of the same program often means more than one process is being executed. Holds the 26 D3FEND classes under Process in D3FEND 1.6.0, e.g. Process, DHCP Service, Mail Service."
