  "d3fend__ATTACKEnterpriseMitigation":
    "labels":
      "identifier": "d3fend__ATTACKEnterpriseMitigation"
    "description": "Holds the 42 D3FEND individuals of the classes under ATTACKEnterpriseMitigation in D3FEND 1.6.0, e.g. Audit, Data Backup, Code Signing. D3FEND states that every ATTACKEnterpriseMitigation semantic-relation some DefensiveTechnique, which it links by related."
    "reference": "http://d3fend.mitre.org/ontologies/d3fend.owl#ATTACKEnterpriseMitigation"
    "properties":
      "uri":
        "type": "STRING"
        "name": "uri"
        "description": "The IRI of the individual the node stands for, e.g. `http://d3fend.mitre.org/ontologies/d3fend.owl#M1013`. Unique within the knowledge base."
        "reference": "https://www.w3.org/TR/rdf11-concepts/#section-IRIs"
      "kind":
        "type": "STRING"
        "name": "kind"
        "description": "The D3FEND class the ATTACKEnterpriseMitigation is an individual of, e.g. `ATTACKEnterpriseMitigation`."
        "reference": "http://d3fend.mitre.org/ontologies/d3fend.owl#ATTACKEnterpriseMitigation"
        "one_of":
          - "ATTACKEnterpriseMitigation"
      "framework":
        "type": "STRING"
        "name": "framework"
        "description": "The threat model the node comes from, by the D3FEND class it falls under, e.g. ATT&CK Enterprise for a class under ATTACKEnterpriseThing."
        "reference": "http://d3fend.mitre.org/ontologies/d3fend.owl#ExternalThreatModelThing"
        "one_of":
          - "ATT&CK Enterprise"
      "name":
        "type": "STRING"
        "name": "name"
        "description": "The name of the ATTACKEnterpriseMitigation: its rdfs:label in D3FEND, e.g. `Application Developer Guidance`."
        "reference": "http://www.w3.org/2000/01/rdf-schema#label"
        "extensions":
          "custom":
            "iri": "http://www.w3.org/2000/01/rdf-schema#label"
      "d3fendComment":
        "type": "STRING"
        "name": "d3fendComment"
        "description": "A public note the D3FEND team has written on the ATTACKEnterpriseMitigation, e.g. on how it maps to D3FEND."
        "reference": "http://d3fend.mitre.org/ontologies/d3fend.owl#d3fend-comment"
        "extensions":
          "custom":
            "iri": "http://d3fend.mitre.org/ontologies/d3fend.owl#d3fend-comment"
    "constraints":
      "key_ATTACKEnterpriseMitigation":
        "type": "KEY"
        "properties":
          - "uri"
        "name": "d3fend__uri_ATTACKEnterpriseMitigation_key"
    "extensions":
      "custom":
        "standard": "MITRE D3FEND 1.6.0"
"relationships":
  "stix__AttackPattern_SAME_AS_attack__Technique":
    "type": "SAME_AS"
    "from":
      "node": "stix__AttackPattern"
    "to":
      "node": "attack__Technique"
    "description": "stix:AttackPattern skos:narrowMatch attack:Technique. ATT&CK publishes its techniques and sub-techniques as STIX attack-pattern objects, keeping their STIX ids. A STIX attack pattern may come from elsewhere, e.g. CAPEC, so the ATT&CK technique is the narrower. Linked nodes share id and stixId, name."
    "reference": "https://mitre-attack.github.io/attack-data-model/schemas/"
    "extensions":
      "custom":
        "predicate": "skos:narrowMatch"
        "exact": false
        "properties":
          "id": "stixId"
          "name": "name"
  "stix__IntrusionSet_SAME_AS_attack__Group":
    "type": "SAME_AS"
    "from":
      "node": "stix__IntrusionSet"
    "to":
      "node": "attack__Group"
    "description": "stix:IntrusionSet skos:narrowMatch attack:Group. ATT&CK publishes its groups as STIX intrusion-set objects. Any intrusion set a producer tracks is a STIX intrusion set, so the ATT&CK group is the narrower. Linked nodes share id and stixId, name."
    "reference": "https://mitre-attack.github.io/attack-data-model/schemas/"
    "extensions":
      "custom":
        "predicate": "skos:narrowMatch"
        "exact": false
        "properties":
          "id": "stixId"
          "name": "name"
  "stix__Campaign_SAME_AS_attack__Campaign":
    "type": "SAME_AS"
    "from":
      "node": "stix__Campaign"
    "to":
      "node": "attack__Campaign"
    "description": "stix:Campaign skos:narrowMatch attack:Campaign. ATT&CK publishes its campaigns as STIX campaign objects. Linked nodes share id and stixId, name."
    "reference": "https://mitre-attack.github.io/attack-data-model/schemas/"
    "extensions":
      "custom":
        "predicate": "skos:narrowMatch"
        "exact": false
        "properties":
          "id": "stixId"
          "name": "name"
  "stix__Malware_SAME_AS_attack__Malware":
    "type": "SAME_AS"
    "from":
      "node": "stix__Malware"
    "to":
      "node": "attack__Malware"
    "description": "stix:Malware skos:narrowMatch attack:Malware. ATT&CK publishes the malware among its software as STIX malware objects. Linked nodes share id and stixId, name."
    "reference": "https://mitre-attack.github.io/attack-data-model/schemas/"
    "extensions":
      "custom":
        "predicate": "skos:narrowMatch"
        "exact": false
        "properties":
          "id": "stixId"
          "name": "name"
  "stix__Tool_SAME_AS_attack__Tool":
    "type": "SAME_AS"
    "from":
      "node": "stix__Tool"
    "to":
      "node": "attack__Tool"
    "description": "stix:Tool skos:narrowMatch attack:Tool. ATT&CK publishes the legitimate tools among its software as STIX tool objects. Linked nodes share id and stixId, name."
    "reference": "https://mitre-attack.github.io/attack-data-model/schemas/"
    "extensions":
      "custom":
        "predicate": "skos:narrowMatch"
        "exact": false
        "properties":
          "id": "stixId"
          "name": "name"
  "stix__CourseOfAction_SAME_AS_attack__Mitigation":
    "type": "SAME_AS"
    "from":
      "node": "stix__CourseOfAction"
    "to":
      "node": "attack__Mitigation"
    "description": "stix:CourseOfAction skos:narrowMatch attack:Mitigation. ATT&CK publishes its mitigations as STIX course-of-action objects. A STIX course of action may be any action taken to prevent or respond to an attack, e.g. blocking a campaign's infrastructure, so the ATT&CK mitigation is the narrower. Linked nodes share id and stixId, name."
    "reference": "https://mitre-attack.github.io/attack-data-model/schemas/"
    "extensions":
      "custom":
        "predicate": "skos:narrowMatch"
        "exact": false
        "properties":
          "id": "stixId"
          "name": "name"
  "attack__Technique_SAME_AS_d3fend__OffensiveTechnique":
    "type": "SAME_AS"
    "from":
      "node": "attack__Technique"
    "to":
      "node": "d3fend__OffensiveTechnique"
    "description": "attack:Technique skos:closeMatch d3fend:OffensiveTechnique. D3FEND imports ATT&CK's Enterprise techniques and sub-techniques as offensive technique classes, named by their ATT&CK ids. D3FEND's offensive techniques also include classes of its own grouping them by tactic, e.g. Initial Access Technique, and ATT&CK's Mobile and ICS techniques are other D3FEND classes. Linked nodes share attackId, name."
    "reference": "https://d3fend.mitre.org/offensive-technique/attack/T1566.001/"
    "extensions":
      "custom":
        "predicate": "skos:closeMatch"
        "exact": false
        "properties":
          "attackId": "attackId"
          "name": "name"
  "attack__Technique_SAME_AS_d3fend__ATTACKICSTechnique":
    "type": "SAME_AS"
    "from":
      "node": "attack__Technique"
    "to":
      "node": "d3fend__ATTACKICSTechnique"
    "description": "attack:Technique skos:closeMatch d3fend:ATTACKICSTechnique. D3FEND imports ATT&CK's ICS techniques as classes of their own. Linked nodes share attackId, name."
    "extensions":
      "custom":
        "predicate": "skos:closeMatch"
        "exact": false
        "properties":
          "attackId": "attackId"
          "name": "name"
  "attack__Technique_SAME_AS_d3fend__ATTACKMobileTechnique":
    "type": "SAME_AS"
    "from":
      "node": "attack__Technique"
    "to":
      "node": "d3fend__ATTACKMobileTechnique"
    "description": "attack:Technique skos:closeMatch d3fend:ATTACKMobileTechnique. D3FEND imports ATT&CK's Mobile techniques as classes of their own. Linked nodes share attackId, name."
    "extensions":
      "custom":
        "predicate": "skos:closeMatch"
        "exact": false
        "properties":
          "attackId": "attackId"
          "name": "name"
  "attack__Tactic_SAME_AS_d3fend__OffensiveTactic":
    "type": "SAME_AS"
    "from":
      "node": "attack__Tactic"
    "to":
      "node": "d3fend__OffensiveTactic"
    "description": "attack:Tactic skos:closeMatch d3fend:OffensiveTactic. D3FEND imports ATT&CK's Enterprise tactics as offensive tactic classes, named by their ATT&CK ids, e.g. TA0001; the ATT&CK id is in the class IRI, not a property of its own, so the name joins them. Linked nodes share name."
    "reference": "https://d3fend.mitre.org/"
    "extensions":
      "custom":
        "predicate": "skos:closeMatch"
        "exact": false
        "properties":
          "name": "name"
  "attack__Mitigation_SAME_AS_d3fend__ATTACKEnterpriseMitigation":
    "type": "SAME_AS"
    "from":
      "node": "attack__Mitigation"
    "to":
      "node": "d3fend__ATTACKEnterpriseMitigation"
    "description": "attack:Mitigation skos:narrowMatch d3fend:ATTACKEnterpriseMitigation. D3FEND imports ATT&CK's Enterprise mitigations, named by their ATT&CK ids, e.g. M1021, and relates each to the defensive techniques that implement it. ATT&CK's Mobile and ICS mitigations have no D3FEND counterpart, so the D3FEND class is the narrower. Linked nodes share name."
    "reference": "https://d3fend.mitre.org/"
    "extensions":
      "custom":
        "predicate": "skos:narrowMatch"
        "exact": false
        "properties":
          "name": "name"
  "stix__File_INSTANCE_OF_d3fend__File":
    "type": "INSTANCE_OF"
    "from":
      "node": "stix__File"
    "to":
      "node": "d3fend__File"
    "description": "stix:File skos:relatedMatch d3fend:File. A STIX file is one observed file, with its name and hashes; a D3FEND file is a class of digital artifact, e.g. Executable File or Email Attachment, that offensive techniques produce and defensive techniques analyse. An observed file is an instance of the classes it belongs to."
    "extensions":
      "custom":
        "predicate": "skos:relatedMatch"
        "exact": false
  "stix__EmailMessage_INSTANCE_OF_d3fend__DigitalArtifact":
    "type": "INSTANCE_OF"
    "from":
      "node": "stix__EmailMessage"
    "to":
      "node": "d3fend__DigitalArtifact"
    "description": "stix:EmailMessage skos:relatedMatch d3fend:DigitalArtifact. A STIX email message is one observed message; D3FEND's Email is a class of digital artifact, and D3FEND's email filtering and analysis techniques act on its instances."
    "extensions":
      "custom":
        "predicate": "skos:relatedMatch"
        "exact": false
  "stix__Url_INSTANCE_OF_d3fend__DigitalArtifact":
    "type": "INSTANCE_OF"
    "from":
      "node": "stix__Url"
    "to":
      "node": "d3fend__DigitalArtifact"
    "description": "stix:Url skos:relatedMatch d3fend:DigitalArtifact. A STIX URL is one observed URL; D3FEND's URL is a class of digital artifact, analysed by URL Analysis."
    "extensions":
      "custom":
        "predicate": "skos:relatedMatch"
        "exact": false
  "stix__Process_INSTANCE_OF_d3fend__Process":
    "type": "INSTANCE_OF"
    "from":
      "node": "stix__Process"
    "to":
      "node": "d3fend__Process"
    "description": "stix:Process skos:relatedMatch d3fend:Process. A STIX process is one observed process; D3FEND's Process is a class of digital artifact."
    "extensions":
      "custom":
        "predicate": "skos:relatedMatch"
        "exact": false
  "stix__NetworkTraffic_INSTANCE_OF_d3fend__NetworkTraffic":
    "type": "INSTANCE_OF"
    "from":
      "node": "stix__NetworkTraffic"
    "to":
      "node": "d3fend__NetworkTraffic"
    "description": "stix:NetworkTraffic skos:relatedMatch d3fend:NetworkTraffic. A STIX network traffic object is one observed flow; D3FEND's network traffic classes, e.g. Outbound Internet Web Traffic, are the kinds of traffic its filtering and analysis techniques act on."
    "extensions":
      "custom":
        "predicate": "skos:relatedMatch"
        "exact": false
