        "extensions":
          "custom":
            "addedByOntology": true
      "direction":
        "type": "STRING"
        "name": "direction"
        "description": "Direction of event. Multiplicity 1..1. Values of AAS enumeration Direction."
        "reference": "https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/spec-metamodel/submodel-elements.html#BasicEventElement"
        "extensions":
          "custom":
            "iri": "https://admin-shell.io/aas/3/2/BasicEventElement/direction"
            "aasType": "Direction"
            "lower": 1
            "upper": 1
