"schema": "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json"
"version": "3.2.0"
"id": "aas-3.2.0"
"name": "Asset Administration Shell 3.2"
"description": "The Asset Administration Shell (AAS) metamodel 3.2, specified by the Industrial Digital Twin Association (IDTA) in IDTA-01001 Part 1 and standardised as IEC 63278-1. The AAS is the standardised digital twin of Industrie 4.0: an asset administration shell describes an asset (its kind and identifiers) through submodels, each made of submodel elements (properties, ranges, files, blobs, collections, lists, entities, relationships, operations, capabilities and events), whose semantics are given by concept descriptions and IEC 61360 data specifications, and which point at each other through references. Generated from the RDF ontology and SHACL shapes of the IDTA metamodel schemas (https://github.com/admin-shell-io/aas-specs-metamodel, tag v3.2.0): each class is a node, each attribute of a primitive or enumeration type a property, each attribute of a class type a composition relationship, and each superclass an implied label."
"nodes":
  "AbstractLangString":
    "labels":
      "identifier": "AbstractLangString"
    "description": "Strings with language tags."
    "reference": "https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/spec-metamodel/datatypes.html#LangStringSet"
    "properties":
      "uid":
        "type": "STRING"
        "name": "uid"
        "description": "The identifier of the AbstractLangString node in the graph, set by the loader: not part of the AAS metamodel. For an Identifiable, its id; for a Referable within one, e.g. a submodel element, the Identifiable's id followed by the element's idShort path; for any other element, e.g. a Reference or a Key, an identifier generated from its parent's uid and its position."
        "extensions":
          "custom":
            "addedByOntology": true
      "language":
        "type": "STRING"
        "name": "language"
        "description": "Language tag conforming to BCP 47. Multiplicity 1..1."
        "reference": "https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/spec-metamodel/datatypes.html#LangStringSet"
        "extensions":
          "custom":
            "iri": "https://admin-shell.io/aas/3/2/AbstractLangString/language"
            "aasType": "xs:string"
            "lower": 1
            "upper": 1
            "pattern": "^(([a-zA-Z]{2,3}(-[a-zA-Z]{3}(-[a-zA-Z]{3}){0,2})?|[a-zA-Z]{4}|[a-zA-Z]{5,8})(-[a-zA-Z]{4})?(-([a-zA-Z]{2}|[0-9]{3}))?(-(([a-zA-Z0-9]){5,8}|[0-9]([a-zA-Z0-9]){3}))*(-[0-9A-WY-Za-wy-z](-([a-zA-Z0-9]){2,8})+)*(-[xX](-([a-zA-Z0-9]){1,8})+)?|[xX](-([a-zA-Z0-9]){1,8})+|((en-GB-oed|i-ami|i-bnn|i-default|i-enochian|i-hak|i-klingon|i-lux|i-mingo|i-navajo|i-pwn|i-tao|i-tay|i-tsu|sgn-BE-FR|sgn-BE-NL|sgn-CH-DE)|(art-lojban|cel-gaulish|no-bok|no-nyn|zh-guoyu|zh-hakka|zh-min|zh-min-nan|zh-xiang)))$"
      "text":
        "type": "STRING"
        "name": "text"
        "description": "Text in the 'language'. Multiplicity 1..1."
        "reference": "https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/spec-metamodel/datatypes.html#LangStringSet"
        "extensions":
          "custom":
            "iri": "https://admin-shell.io/aas/3/2/AbstractLangString/text"
            "aasType": "xs:string"
            "lower": 1
            "upper": 1
            "minLength": 1
    "constraints":
      "key_AbstractLangString":
        "type": "KEY"
        "properties":
          - "uid"
        "name": "uid_AbstractLangString_key"
      "exists_AbstractLangString_language":
        "type": "EXISTS"
        "properties":
          - "language"
        "name": "language_AbstractLangString_exists"
      "exists_AbstractLangString_text":
        "type": "EXISTS"
        "properties":
          - "text"
        "name": "text_AbstractLangString_exists"
    "extensions":
      "custom":
        "iri": "https://admin-shell.io/aas/3/2/AbstractLangString"
        "section": "datatypes"
        "abstract": true
  "AdministrativeInformation":
    "labels":
