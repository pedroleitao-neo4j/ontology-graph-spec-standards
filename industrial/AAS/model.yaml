            "aasType": "xs:string"
            "lower": 0
            "upper": 1
            "pattern": "^-?(([1-9][0-9][0-9][0-9]+)|(0[0-9][0-9][0-9]))-((0[1-9])|(1[0-2]))-((0[1-9])|([12][0-9])|(3[01]))T(((([01][0-9])|(2[0-3])):[0-5][0-9]:([0-5][0-9])(\\.[0-9]+)?)|24:00:00(\\.0+)?)(Z|\\+00:00|-00:00)$"
      "updatedAt":
        "type": "STRING"
        "name": "updatedAt"
        "description": "Date of update."
        "reference": "https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/spec-metamodel/common.html#AdministrativeInformation"
        "extensions":
          "custom":
            "iri": "https://admin-shell.io/aas/3/2/AdministrativeInformation/updatedAt"
            "aasType": "xs:string"
            "lower": 0
            "upper": 1
            "pattern": "^-?(([1-9][0-9][0-9][0-9]+)|(0[0-9][0-9][0-9]))-((0[1-9])|(1[0-2]))-((0[1-9])|([12][0-9])|(3[01]))T(((([01][0-9])|(2[0-3])):[0-5][0-9]:([0-5][0-9])(\\.[0-9]+)?)|24:00:00(\\.0+)?)(Z|\\+00:00|-00:00)$"
      "templateId":
        "type": "STRING"
        "name": "templateId"
        "description": "Identifier of the template that guided the creation of the element."
        "reference": "https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/spec-metamodel/common.html#AdministrativeInformation"
        "extensions":
          "custom":
            "iri": "https://admin-shell.io/aas/3/2/AdministrativeInformation/templateId"
            "aasType": "xs:string"
            "lower": 0
            "upper": 1
            "minLength": 1
            "maxLength": 2048
    "constraints":
      "key_AdministrativeInformation":
        "type": "KEY"
        "properties":
          - "uid"
        "name": "uid_AdministrativeInformation_key"
    "extensions":
      "custom":
        "iri": "https://admin-shell.io/aas/3/2/AdministrativeInformation"
        "section": "common"
