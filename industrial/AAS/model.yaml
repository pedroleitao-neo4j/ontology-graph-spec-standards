  "AssetInformation":
    "labels":
      "identifier": "AssetInformation"
    "description": "In 'AssetInformation' identifying meta data of the asset that is represented by an AAS is defined."
    "reference": "https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/spec-metamodel/core.html#AssetInformation"
    "properties":
      "uid":
        "type": "STRING"
        "name": "uid"
        "description": "The identifier of the AssetInformation node in the graph, set by the loader: not part of the AAS metamodel. For an Identifiable, its id; for a Referable within one, e.g. a submodel element, the Identifiable's id followed by the element's idShort path; for any other element, e.g. a Reference or a Key, an identifier generated from its parent's uid and its position."
        "extensions":
          "custom":
            "addedByOntology": true
      "assetKind":
        "type": "STRING"
        "name": "assetKind"
        "description": "Denotes whether the Asset is of kind 'Type' or 'Instance', 'Role' or 'Batch'. Multiplicity 1..1. Values of AAS enumeration AssetKind."
        "reference": "https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/spec-metamodel/core.html#AssetInformation"
        "extensions":
          "custom":
            "iri": "https://admin-shell.io/aas/3/2/AssetInformation/assetKind"
            "aasType": "AssetKind"
            "lower": 1
            "upper": 1
        "one_of":
          - "Batch"
          - "Instance"
          - "NotApplicable"
          - "Role"
          - "Type"
      "globalAssetId":
        "type": "STRING"
        "name": "globalAssetId"
        "description": "Global identifier of the asset the AAS is representing."
        "reference": "https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/spec-metamodel/core.html#AssetInformation"
        "extensions":
          "custom":
            "iri": "https://admin-shell.io/aas/3/2/AssetInformation/globalAssetId"
            "aasType": "xs:string"
            "lower": 0
            "upper": 1
            "minLength": 1
            "maxLength": 2048
      "assetType":
        "type": "STRING"
        "name": "assetType"
        "description": "In case 'assetKind' is applicable the 'assetType' is the asset ID of the type asset of the asset under consideration as identified by 'globalAssetId'."
        "reference": "https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/spec-metamodel/core.html#AssetInformation"
        "extensions":
          "custom":
            "iri": "https://admin-shell.io/aas/3/2/AssetInformation/assetType"
            "aasType": "xs:string"
            "lower": 0
            "upper": 1
            "minLength": 1
            "maxLength": 2048
    "constraints":
      "key_AssetInformation":
        "type": "KEY"
        "properties":
          - "uid"
        "name": "uid_AssetInformation_key"
      "exists_AssetInformation_assetKind":
        "type": "EXISTS"
        "properties":
          - "assetKind"
        "name": "assetKind_AssetInformation_exists"
    "extensions":
      "custom":
        "iri": "https://admin-shell.io/aas/3/2/AssetInformation"
        "section": "core"
  "BasicEventElement":
    "labels":
