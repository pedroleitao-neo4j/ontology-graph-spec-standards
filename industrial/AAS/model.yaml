    "description": "A basic event element."
    "reference": "https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/spec-metamodel/submodel-elements.html#BasicEventElement"
    "properties":
      "uid":
        "type": "STRING"
