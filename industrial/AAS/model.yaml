          - "input"
          - "output"
      "state":
        "type": "STRING"
        "name": "state"
        "description": "State of event. Multiplicity 1..1. Values of AAS enumeration StateOfEvent."
        "reference": "https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/spec-metamodel/submodel-elements.html#BasicEventElement"
        "extensions":
          "custom":
            "iri": "https://admin-shell.io/aas/3/2/BasicEventElement/state"
            "aasType": "StateOfEvent"
            "lower": 1
            "upper": 1
        "one_of":
          - "off"
          - "on"
      "messageTopic":
        "type": "STRING"
        "name": "messageTopic"
        "description": "Information for the outer message infrastructure for scheduling the event to the respective communication channel."
        "reference": "https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/spec-metamodel/submodel-elements.html#BasicEventElement"
        "extensions":
          "custom":
            "iri": "https://admin-shell.io/aas/3/2/BasicEventElement/messageTopic"
            "aasType": "xs:string"
            "lower": 0
            "upper": 1
            "minLength": 1
            "maxLength": 255
      "lastUpdate":
        "type": "STRING"
        "name": "lastUpdate"
        "description": "Timestamp in UTC, when the last event was received (input direction) or sent (output direction)."
        "reference": "https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/spec-metamodel/submodel-elements.html#BasicEventElement"
        "extensions":
          "custom":
            "iri": "https://admin-shell.io/aas/3/2/BasicEventElement/lastUpdate"
            "aasType": "xs:string"
            "lower": 0
            "upper": 1
            "pattern": "^-?(([1-9][0-9][0-9][0-9]+)|(0[0-9][0-9][0-9]))-((0[1-9])|(1[0-2]))-((0[1-9])|([12][0-9])|(3[01]))T(((([01][0-9])|(2[0-3])):[0-5][0-9]:([0-5][0-9])(\\.[0-9]+)?)|24:00:00(\\.0+)?)(Z|\\+00:00|-00:00)$"
      "minInterval":
        "type": "STRING"
        "name": "minInterval"
        "description": "For input direction, reports on the maximum frequency, the software entity behind the respective Referable can handle input events."
        "reference": "https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/spec-metamodel/submodel-elements.html#BasicEventElement"
        "extensions":
          "custom":
            "iri": "https://admin-shell.io/aas/3/2/BasicEventElement/minInterval"
            "aasType": "xs:string"
            "lower": 0
            "upper": 1
            "pattern": "^-?P((([0-9]+Y([0-9]+M)?([0-9]+D)?|([0-9]+M)([0-9]+D)?|([0-9]+D))(T(([0-9]+H)([0-9]+M)?([0-9]+(\\.[0-9]+)?S)?|([0-9]+M)([0-9]+(\\.[0-9]+)?S)?|([0-9]+(\\.[0-9]+)?S)))?)|(T(([0-9]+H)([0-9]+M)?([0-9]+(\\.[0-9]+)?S)?|([0-9]+M)([0-9]+(\\.[0-9]+)?S)?|([0-9]+(\\.[0-9]+)?S))))$"
      "maxInterval":
        "type": "STRING"
        "name": "maxInterval"
        "description": "For input direction: not applicable."
        "reference": "https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/spec-metamodel/submodel-elements.html#BasicEventElement"
        "extensions":
          "custom":
            "iri": "https://admin-shell.io/aas/3/2/BasicEventElement/maxInterval"
            "aasType": "xs:string"
            "lower": 0
            "upper": 1
            "pattern": "^-?P((([0-9]+Y([0-9]+M)?([0-9]+D)?|([0-9]+M)([0-9]+D)?|([0-9]+D))(T(([0-9]+H)([0-9]+M)?([0-9]+(\\.[0-9]+)?S)?|([0-9]+M)([0-9]+(\\.[0-9]+)?S)?|([0-9]+(\\.[0-9]+)?S)))?)|(T(([0-9]+H)([0-9]+M)?([0-9]+(\\.[0-9]+)?S)?|([0-9]+M)([0-9]+(\\.[0-9]+)?S)?|([0-9]+(\\.[0-9]+)?S))))$"
    "constraints":
      "key_BasicEventElement":
        "type": "KEY"
        "properties":
          - "uid"
        "name": "uid_BasicEventElement_key"
      "exists_BasicEventElement_direction":
        "type": "EXISTS"
        "properties":
          - "direction"
        "name": "direction_BasicEventElement_exists"
      "exists_BasicEventElement_state":
        "type": "EXISTS"
        "properties":
          - "state"
        "name": "state_BasicEventElement_exists"
    "extensions":
      "custom":
        "iri": "https://admin-shell.io/aas/3/2/BasicEventElement"
        "section": "submodel-elements"
