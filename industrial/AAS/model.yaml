          "custom":
            "addedByOntology": true
      "version":
        "type": "STRING"
        "name": "version"
        "description": "Version of the element."
        "reference": "https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/spec-metamodel/common.html#AdministrativeInformation"
        "extensions":
          "custom":
            "iri": "https://admin-shell.io/aas/3/2/AdministrativeInformation/version"
            "aasType": "xs:string"
            "lower": 0
            "upper": 1
            "minLength": 1
            "maxLength": 4
      "revision":
        "type": "STRING"
        "name": "revision"
        "description": "Revision of the element."
        "reference": "https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/spec-metamodel/common.html#AdministrativeInformation"
        "extensions":
          "custom":
            "iri": "https://admin-shell.io/aas/3/2/AdministrativeInformation/revision"
            "aasType": "xs:string"
            "lower": 0
            "upper": 1
            "minLength": 1
            "maxLength": 4
      "createdAt":
        "type": "STRING"
        "name": "createdAt"
        "description": "Date of creation."
        "reference": "https://industrialdigitaltwin.io/aas-specifications/IDTA-01001/v3.2/spec-metamodel/common.html#AdministrativeInformation"
        "extensions":
