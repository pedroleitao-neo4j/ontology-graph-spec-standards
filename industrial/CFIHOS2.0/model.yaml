  "AdditionalFile":
    "labels":
      "identifier": "AdditionalFile"
    "description": "A file that makes up a particular document revision. In some circumstances, a particular document revision can be made up of more than one file. Examples include: - Native files - Translations of a document - Large documents that have been split into several smaller files When this is the case, all these files shall be provided as a 'set of files'."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000023"
    "properties":
      "documentNumber":
        "type": "STRING"
        "name": "documentNumber"
        "description": "The unique identifier for the document according to the Owner/Operator document numbering scheme, to which the additional file is associated. Must be present in DOCUMENT REVISION. At most 40 characters. e.g. `T-10000001`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000154"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000154"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "documentRevisionCode":
        "type": "STRING"
