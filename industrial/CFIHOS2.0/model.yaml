  "DocumentMaster":
    "labels":
      "identifier": "DocumentMaster"
    "description": "A placeholder that allows a project to identify a particular information content to be created or updated. A document master is identified by a document number, and it groups all the document revisions created to mature the information content. An index of document masters is called a Master Document Register (MDR), and it allows a project to plan when the information content will reach a particular status (e.g., AFC, ASB). Remark: The first issuance of the document Master will be the baseline plan. Subsequent issuances will reflect any changes in forecast dates."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000022"
    "properties":
      "documentNumber":
        "type": "STRING"
        "name": "documentNumber"
        "description": "The unique identifier for the Document according to the Owner/Operator Document numbering scheme. At most 40 characters. e.g. `KC01-71-990-KW-T-YP-0002-000`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000154"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000154"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "documentTitle":
        "type": "STRING"
        "name": "documentTitle"
        "description": "A description, in a short and concise manner, of the content of the document. At most 255 characters. e.g. `Laydown Area & Pipe Rack North / South`. The title of the document usually appears on the front page of the document or in title block."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000168"
        "pattern": "^[\\s\\S]{0,255}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000168"
            "format": "Text, max 255 characters"
            "requirement": "Mandatory"
      "disciplineDocumentTypeShortCode":
        "type": "STRING"
        "name": "disciplineDocumentTypeShortCode"
        "description": "At alternate way of identifying uniquely a combination of discipline and document type. Must be present in DISCIPLINE DOCUMENT TYPE. At most 6 characters. e.g. `MP6067`. This attribute is calculated as a concatenation of the discipline code and the document type short code."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000207"
        "pattern": "^[\\s\\S]{0,6}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000207"
            "format": "Text, max 6 characters"
            "requirement": "Mandatory"
      "documentReviewType":
        "type": "STRING"
        "name": "documentReviewType"
        "description": "A code that uniquely identifies a document review type. Must be present in DOCUMENT REVIEW TYPE. At most 40 characters. e.g. `not specified`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000064"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000064"
            "format": "Text, max 40 characters"
            "requirement": "Mandatory"
      "forecastReviewDate":
        "type": "DATE"
        "name": "forecastReviewDate"
        "description": "The latest forecast date at which the document is expected to be issued for review. e.g. `2022-11-15`. The first issuance of the Document_Master will be the baseline plan."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000065"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000065"
            "format": "Date"
            "requirement": "Optional"
      "forecastApprovalDate":
        "type": "DATE"
        "name": "forecastApprovalDate"
        "description": "The latest forecast date at which the document is expected to be issued for approval. e.g. `2022-11-15`. The first issuance of the Document_Master will be the baseline plan."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000067"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000067"
            "format": "Date"
            "requirement": "Optional"
      "forecastApprovedForDesignDate":
        "type": "DATE"
        "name": "forecastApprovedForDesignDate"
        "description": "The latest forecast date at which the document is expected to be issued approved for design. e.g. `2022-11-15`. The first issuance of the Document_Master will be the baseline plan."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000069"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000069"
            "format": "Date"
            "requirement": "Optional"
      "forecastApprovedForConstructionDate":
        "type": "DATE"
        "name": "forecastApprovedForConstructionDate"
        "description": "The latest forecast date at which the document is expected to be issued approved for construction. e.g. `2022-11-15`. The first issuance of the Document_Master will be the baseline plan."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000071"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000071"
            "format": "Date"
            "requirement": "Optional"
      "forecastAsBuiltDate":
        "type": "DATE"
        "name": "forecastAsBuiltDate"
        "description": "The latest forecast date at which the document is expected to be issued as-built. e.g. `2022-11-15`. The first issuance of the Document_Master will be the baseline plan."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000073"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000073"
            "format": "Date"
            "requirement": "Optional"
    "constraints":
