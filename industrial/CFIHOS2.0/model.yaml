"schema": "https://neo4j.com/docs/ontology-graph-spec/1.1.0/schema.json"
"version": "2.0"
"id": "cfihos-2.0"
"name": "CFIHOS 2.0"
"description": "The Capital Facilities Information Handover Specification (CFIHOS) V2.0 data model, published by IOGP JIP36 (https://www.jip36-cfihos.org/cfihos-standards/). CFIHOS standardises the engineering data and documents that contractors and suppliers hand over to the owner/operator of a process or energy facility: the plant breakdown structure and its tags, the equipment and model parts that fulfil them, purchase orders and spares, the reference data library (tag and equipment classes, properties, units of measure, disciplines and document types) that classifies them, and the documents that describe them. Generated from the CFIHOS V2.0 Data Dictionary (C-DM-002): each entity is a node, each attribute a property, each identifier a key, and each relationship a relationship from parent to child entity."
"nodes":
  "Site":
    "labels":
      "identifier": "Site"
    "description": "A geographical surface that can be identified on a map."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000001"
    "properties":
      "siteCode":
        "type": "STRING"
        "name": "siteCode"
        "description": "A code that uniquely identifies the site. At most 40 characters. e.g. `KAS`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000003"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000003"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "siteName":
        "type": "STRING"
        "name": "siteName"
        "description": "A unique name to identify a geographical location. At most 100 characters. e.g. `Kashagan field`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000004"
        "pattern": "^[\\s\\S]{0,100}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000004"
            "format": "Text, max 100 characters"
            "requirement": "Mandatory"
      "measurementSystemCode":
        "type": "STRING"
        "name": "measurementSystemCode"
        "description": "The default measurement system that is used by a site. Must be present in MEASUREMENT SYSTEM. At most 10 characters. e.g. `SI`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000240"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000240"
            "format": "Text, max 10 characters"
            "requirement": "Mandatory"
    "constraints":
      "key_Site":
        "type": "KEY"
        "properties":
          - "siteCode"
        "name": "siteCode_Site_key"
      "exists_Site_siteName":
        "type": "EXISTS"
        "properties":
          - "siteName"
        "name": "siteName_Site_exists"
      "exists_Site_measurementSystemCode":
        "type": "EXISTS"
        "properties":
          - "measurementSystemCode"
        "name": "measurementSystemCode_Site_exists"
    "extensions":
      "custom":
        "cfihosCode": "CFIHOS-00000001"
        "section": "A.2.01"
        "dataSource": "Owner/Operator"
  "Plant":
    "labels":
      "identifier": "Plant"
    "description": "An assembly of equipment that perform a physical or chemical process, including production, transportation and storage. A Plant represents the 'high level' function to be performed, and during the design, a Plant is decomposed in Process Units and Tags."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000031"
    "properties":
      "plantCode":
        "type": "STRING"
        "name": "plantCode"
        "description": "A code that uniquely identifies the plant. At most 40 characters. e.g. `6000`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000005"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000005"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "plantName":
        "type": "STRING"
        "name": "plantName"
        "description": "The full name of the plant. At most 100 characters. e.g. `Onshore Processing Facility (OPF)`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000006"
        "pattern": "^[\\s\\S]{0,100}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000006"
            "format": "Text, max 100 characters"
            "requirement": "Mandatory"
      "siteCode":
        "type": "STRING"
        "name": "siteCode"
        "description": "A code that uniquely identifies the site. Must be present in SITE. At most 40 characters. e.g. `KAS`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000003"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000003"
            "format": "Text, max 40 characters"
            "requirement": "Optional"
      "isoLanguageCode":
        "type": "STRING"
        "name": "isoLanguageCode"
        "description": "The language that should be used by default for all exchange of information related to that plant. Must be present in ISO LANGUAGE. At most 2 characters. e.g. `EN`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000147"
        "pattern": "^[\\s\\S]{0,2}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000147"
            "format": "Text, max 2 characters"
            "requirement": "Optional"
      "measurementSystemCode":
        "type": "STRING"
        "name": "measurementSystemCode"
        "description": "The default measurement system that is used by a plant. Must be present in MEASUREMENT SYSTEM. At most 10 characters. e.g. `SI`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000240"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000240"
            "format": "Text, max 10 characters"
            "requirement": "Optional"
      "industrialComplexCode":
        "type": "STRING"
        "name": "industrialComplexCode"
        "description": "A code that uniquely identifies the industrial complex. Must be present in INDUSTRIAL COMPLEX. At most 40 characters. e.g. `VSI`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000367"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000367"
            "format": "Text, max 40 characters"
            "requirement": "Optional"
    "constraints":
      "key_Plant":
        "type": "KEY"
        "properties":
          - "plantCode"
        "name": "plantCode_Plant_key"
      "exists_Plant_plantName":
        "type": "EXISTS"
        "properties":
          - "plantName"
        "name": "plantName_Plant_exists"
    "extensions":
      "custom":
        "cfihosCode": "CFIHOS-00000031"
        "section": "A.2.02"
        "dataSource": "Owner/Operator"
  "ProcessUnit":
    "labels":
      "identifier": "ProcessUnit"
    "description": "A decomposition of the 'high level' Facility function into more granular 'sub-functions'. This facility breakdown structure is decided by the process engineer."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000002"
    "properties":
      "plantCode":
        "type": "STRING"
        "name": "plantCode"
        "description": "The plant the process unit is part of. Must be present in PLANT. At most 40 characters. e.g. `6000`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000005"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000005"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "processUnitCode":
        "type": "STRING"
        "name": "processUnitCode"
        "description": "A code that uniquely identifies the process unit within the plant. At most 40 characters. e.g. `36`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000157"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000157"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "processUnitName":
        "type": "STRING"
        "name": "processUnitName"
        "description": "A name describing the function of the process unit. At most 100 characters. e.g. `Inlet compression`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000008"
        "pattern": "^[\\s\\S]{0,100}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000008"
            "format": "Text, max 100 characters"
            "requirement": "Mandatory"
    "constraints":
      "key_ProcessUnit":
        "type": "KEY"
        "properties":
          - "plantCode"
          - "processUnitCode"
        "name": "plantCode_processUnitCode_ProcessUnit_key"
      "exists_ProcessUnit_processUnitName":
        "type": "EXISTS"
        "properties":
          - "processUnitName"
        "name": "processUnitName_ProcessUnit_exists"
    "extensions":
      "custom":
        "cfihosCode": "CFIHOS-00000002"
        "section": "A.2.03"
        "dataSource": "Owner/Operator"
  "Area":
    "labels":
      "identifier": "Area"
    "description": "A geographical surface occupied by a Plant. A plant area is created to identify the physical location of an equipment within a plant."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000003"
    "properties":
      "plantCode":
        "type": "STRING"
        "name": "plantCode"
        "description": "The plant the area is part of. Must be present in PLANT. At most 40 characters. e.g. `6000`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000005"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000005"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "areaCode":
        "type": "STRING"
        "name": "areaCode"
        "description": "A code that uniquely identifies the area within the plant. At most 10 characters. e.g. `Topsides`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000001"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000001"
            "format": "Text, max 10 characters"
            "requirement": "Identifier"
      "areaName":
        "type": "STRING"
        "name": "areaName"
        "description": "A name describing the location of an area within the plant. At most 100 characters. e.g. `Topsides Deck 1`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000002"
        "pattern": "^[\\s\\S]{0,100}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000002"
            "format": "Text, max 100 characters"
            "requirement": "Mandatory"
    "constraints":
      "key_Area":
        "type": "KEY"
        "properties":
          - "plantCode"
          - "areaCode"
        "name": "plantCode_areaCode_Area_key"
      "exists_Area_areaName":
        "type": "EXISTS"
        "properties":
          - "areaName"
        "name": "areaName_Area_exists"
    "extensions":
      "custom":
        "cfihosCode": "CFIHOS-00000003"
        "section": "A.2.04"
        "dataSource": "EPC"
  "ConstructionAssembly":
    "labels":
      "identifier": "ConstructionAssembly"
    "description": "A grouping of tags intended to be assembled and installed as a whole. Tag modules are created to facilitate fabrication during the project."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000026"
    "properties":
      "plantCode":
        "type": "STRING"
        "name": "plantCode"
        "description": "The plant at which the construction assembly is constructed. Must be present in PLANT. At most 40 characters. e.g. `Topsides Deck 1`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000005"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000005"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "constructionAssemblyCode":
        "type": "STRING"
        "name": "constructionAssemblyCode"
        "description": "A code that uniquely identifies the construction assembly at a plant. At most 10 characters. e.g. `CIU`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000130"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000130"
            "format": "Text, max 10 characters"
            "requirement": "Identifier"
      "constructionAssemblyName":
        "type": "STRING"
        "name": "constructionAssemblyName"
        "description": "A name describing the purpose of a construction assembly. At most 100 characters. e.g. `Chemical Injection Unit`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000131"
        "pattern": "^[\\s\\S]{0,100}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000131"
            "format": "Text, max 100 characters"
            "requirement": "Mandatory"
      "parentConstructionAssemblyCode":
        "type": "STRING"
        "name": "parentConstructionAssemblyCode"
        "description": "A code that uniquely identifies the parent of a construction assembly at a plant. Must be present in CONSTRUCTION ASSEMBLY. At most 10 characters. e.g. `CIU`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000175"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000175"
            "format": "Text, max 10 characters"
            "requirement": "Optional"
    "constraints":
      "key_ConstructionAssembly":
        "type": "KEY"
        "properties":
          - "plantCode"
          - "constructionAssemblyCode"
        "name": "plantCode_constructionAssemblyCode_ConstructionAssembly_key"
      "exists_ConstructionAssembly_constructionAssemblyName":
        "type": "EXISTS"
        "properties":
          - "constructionAssemblyName"
        "name": "constructionAssemblyName_ConstructionAssembly_exists"
    "extensions":
      "custom":
        "cfihosCode": "CFIHOS-00000026"
        "section": "A.2.05"
        "dataSource": "EPC"
  "CommissioningUnit":
    "labels":
      "identifier": "CommissioningUnit"
    "description": "A grouping of tags (if the commissioning unit is at the lowest level in the structure), or sub-commissioning units, by the commissioning discipline. This grouping allows one to perform commissioning activities."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000004"
    "properties":
      "plantCode":
        "type": "STRING"
        "name": "plantCode"
        "description": "The plant the commissioning unit is part of. Must be present in PLANT. At most 40 characters. e.g. `6000`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000005"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000005"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "commissioningUnitCode":
        "type": "STRING"
        "name": "commissioningUnitCode"
        "description": "A code that uniquely identifies the commissioning unit within a plant. At most 10 characters. e.g. `980`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000009"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000009"
            "format": "Text, max 10 characters"
            "requirement": "Identifier"
      "commissioningUnitName":
        "type": "STRING"
        "name": "commissioningUnitName"
        "description": "The name by which the commission unit is usually designated. At most 100 characters. e.g. `Plant Production Manifold East`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000010"
        "pattern": "^[\\s\\S]{0,100}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000010"
            "format": "Text, max 100 characters"
            "requirement": "Mandatory"
      "parentCommissioningUnitCode":
        "type": "STRING"
        "name": "parentCommissioningUnitCode"
        "description": "A code that uniquely identifies the parent of the commission unit at the plant. Must be present in COMMISSIONING UNIT. At most 10 characters. e.g. `981`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000176"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000176"
            "format": "Text, max 10 characters"
            "requirement": "Optional"
    "constraints":
      "key_CommissioningUnit":
        "type": "KEY"
        "properties":
          - "plantCode"
          - "commissioningUnitCode"
        "name": "plantCode_commissioningUnitCode_CommissioningUnit_key"
      "exists_CommissioningUnit_commissioningUnitName":
        "type": "EXISTS"
        "properties":
          - "commissioningUnitName"
        "name": "commissioningUnitName_CommissioningUnit_exists"
    "extensions":
      "custom":
        "cfihosCode": "CFIHOS-00000004"
        "section": "A.2.07"
        "dataSource": "EPC"
  "LeafNodeCommissioningUnit":
    "labels":
      "identifier": "LeafNodeCommissioningUnit"
      "implied":
        - "CommissioningUnit"
    "description": "A commissioning unit that is at the lowest level in the hierarchical structure of commissioning units."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000037"
    "properties":
      "plantCode":
        "type": "STRING"
        "name": "plantCode"
        "description": "The plant the commissioning unit is part of. Must be present in COMMISSIONING UNIT. At most 40 characters. e.g. `6000`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000005"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000005"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "commissioningUnitCode":
        "type": "STRING"
        "name": "commissioningUnitCode"
        "description": "A code that uniquely identifies the commissioning unit within a plant. Must be present in COMMISSIONING UNIT. At most 10 characters. e.g. `980`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000009"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000009"
            "format": "Text, max 10 characters"
            "requirement": "Identifier"
    "constraints":
      "key_LeafNodeCommissioningUnit":
        "type": "KEY"
        "properties":
          - "plantCode"
          - "commissioningUnitCode"
        "name": "plantCode_commissioningUnitCode_LeafNodeCommissioningUnit_key"
    "extensions":
      "custom":
        "cfihosCode": "CFIHOS-00000037"
        "section": "A.2.08"
        "dataSource": "EPC"
  "MaintenanceUnit":
    "labels":
      "identifier": "MaintenanceUnit"
    "description": "A grouping of maintenance system by the maintenance discipline. This grouping allows one to perform maintenance activities."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000006"
    "properties":
      "plantCode":
        "type": "STRING"
        "name": "plantCode"
        "description": "The plant at which the maintenance unit is located. Must be present in PLANT. At most 40 characters. e.g. `6000`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000005"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000005"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "maintenanceUnitCode":
        "type": "STRING"
        "name": "maintenanceUnitCode"
        "description": "A code that uniquely identifies the maintenance unit at a plant. At most 10 characters. e.g. `A01`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000013"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000013"
            "format": "Text, max 10 characters"
            "requirement": "Identifier"
      "maintenanceUnitName":
        "type": "STRING"
        "name": "maintenanceUnitName"
        "description": "The name by which the maintenance unit is usually designated. At most 100 characters. e.g. `Oil Wells and Wellhead Facilities`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000014"
        "pattern": "^[\\s\\S]{0,100}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000014"
            "format": "Text, max 100 characters"
            "requirement": "Mandatory"
    "constraints":
      "key_MaintenanceUnit":
        "type": "KEY"
        "properties":
          - "plantCode"
          - "maintenanceUnitCode"
        "name": "plantCode_maintenanceUnitCode_MaintenanceUnit_key"
      "exists_MaintenanceUnit_maintenanceUnitName":
        "type": "EXISTS"
        "properties":
          - "maintenanceUnitName"
        "name": "maintenanceUnitName_MaintenanceUnit_exists"
    "extensions":
      "custom":
        "cfihosCode": "CFIHOS-00000006"
        "section": "A.2.09"
        "dataSource": "Owner/Operator"
  "MaintenanceSystem":
    "labels":
      "identifier": "MaintenanceSystem"
    "description": "A grouping of tags that can be maintained at the same time. Maintenance systems are defined by the maintenance discipline."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000007"
    "properties":
      "plantCode":
        "type": "STRING"
        "name": "plantCode"
        "description": "The plant at which the maintenance unit is located. Must be present in MAINTENANCE UNIT. At most 40 characters. e.g. `6000`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000005"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000005"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "maintenanceUnitCode":
        "type": "STRING"
        "name": "maintenanceUnitCode"
        "description": "The maintenance unit to which the maintenance system belongs. Must be present in MAINTENANCE UNIT. At most 10 characters. e.g. `A01`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000013"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000013"
            "format": "Text, max 10 characters"
            "requirement": "Identifier"
      "maintenanceSystemCode":
        "type": "STRING"
        "name": "maintenanceSystemCode"
        "description": "A code that uniquely identifies the maintenance system within a maintenance unit. At most 10 characters. e.g. `A01.01`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000015"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000015"
            "format": "Text, max 10 characters"
            "requirement": "Identifier"
      "maintenanceSystemName":
        "type": "STRING"
        "name": "maintenanceSystemName"
        "description": "The name by which the maintenance system is usually designated. At most 100 characters. e.g. `Oil Wells, Xmas Trees and Flowlines`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000016"
        "pattern": "^[\\s\\S]{0,100}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000016"
            "format": "Text, max 100 characters"
            "requirement": "Mandatory"
      "maintenanceSystemActualStartupDate":
        "type": "DATE"
        "name": "maintenanceSystemActualStartupDate"
        "description": "The date at which the maintenance system has been started for the first time (on a continuous basis). e.g. `2010-01-01`. This information is used by the maintenance discipline to develop maintenance plans, and particularly to determine when the first maintenance activities will have to happen."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000017"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000017"
            "format": "Date"
            "requirement": "Optional"
    "constraints":
      "key_MaintenanceSystem":
        "type": "KEY"
        "properties":
          - "plantCode"
          - "maintenanceUnitCode"
          - "maintenanceSystemCode"
        "name": "plantCode_maintenanceUnitCode_maintenanceSystemCode_MaintenanceSystem_key"
      "exists_MaintenanceSystem_maintenanceSystemName":
        "type": "EXISTS"
        "properties":
          - "maintenanceSystemName"
        "name": "maintenanceSystemName_MaintenanceSystem_exists"
    "extensions":
      "custom":
        "cfihosCode": "CFIHOS-00000007"
        "section": "A.2.10"
        "dataSource": "Owner/Operator"
  "CorrosionLoop":
    "labels":
      "identifier": "CorrosionLoop"
    "description": "A grouping of tags with similar operating conditions, e.g. pipe, equipment, .. (i.e., made of similar materials of construction, sharing similar corrosion/degradation rate). Corrosion Loops are created to monitor the corrosions of equipment and thus are important to establish proper inspection strategies."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000010"
    "properties":
      "plantCode":
        "type": "STRING"
        "name": "plantCode"
        "description": "The plant at which the corrosion loop is located. Must be present in PLANT. At most 40 characters. e.g. `6000`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000005"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000005"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "corrosionLoopCode":
        "type": "STRING"
        "name": "corrosionLoopCode"
        "description": "A code that uniquely identifies the corrosion loop at a plant. At most 40 characters. e.g. `CL1101`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000018"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000018"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "corrosionLoopName":
        "type": "STRING"
        "name": "corrosionLoopName"
        "description": "The name by which the corrosion loop is usually designated. At most 255 characters. e.g. `Absorber circuit`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000019"
        "pattern": "^[\\s\\S]{0,255}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000019"
            "format": "Text, max 255 characters"
            "requirement": "Mandatory"
      "corrosionLoopDescription":
        "type": "STRING"
        "name": "corrosionLoopDescription"
        "description": "A description of what the corrosion loop is. At most 255 characters. e.g. `V301 separator vessel below demister. Condensate liquid outlet piping to BL.`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000020"
        "pattern": "^[\\s\\S]{0,255}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000020"
            "format": "Text, max 255 characters"
            "requirement": "Mandatory"
      "corrosionLoopTypeCode":
        "type": "STRING"
        "name": "corrosionLoopTypeCode"
        "description": "The type of corrosion loop that classifies this corrosion loop. Must be present in CORROSION LOOP TYPE. At most 10 characters."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000023"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000023"
            "format": "Text, max 10 characters"
            "requirement": "Optional"
      "corrosionLoopProcessDescription":
        "type": "STRING"
        "name": "corrosionLoopProcessDescription"
        "description": "A description of the process performed by the elements of the corrosion loop. At most 255 characters. e.g. `V301 separates the 15 barg gas stream into dry saturated gas and condensate containing hydrocarbons, free sour water (CO2 and H2S) and inhibitor.`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000021"
        "pattern": "^[\\s\\S]{0,255}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000021"
            "format": "Text, max 255 characters"
            "requirement": "Mandatory"
      "corrosionTypeDescription":
        "type": "STRING"
        "name": "corrosionTypeDescription"
        "description": "A description of the expected effects of the corrosion. At most 255 characters. e.g. `Vessel is made of 15mm PWHT carbon steel including 3mm corrosion allowance. Normal operation Wet CO2 corrosion. Special operating conditions Un-inhibited the corrosion rate is 1.1mm/yr. Inhibiter injection should be monitored and alarmed.`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000022"
        "pattern": "^[\\s\\S]{0,255}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000022"
            "format": "Text, max 255 characters"
            "requirement": "Optional"
    "constraints":
      "key_CorrosionLoop":
        "type": "KEY"
        "properties":
          - "plantCode"
          - "corrosionLoopCode"
        "name": "plantCode_corrosionLoopCode_CorrosionLoop_key"
      "exists_CorrosionLoop_corrosionLoopName":
        "type": "EXISTS"
        "properties":
          - "corrosionLoopName"
        "name": "corrosionLoopName_CorrosionLoop_exists"
      "exists_CorrosionLoop_corrosionLoopDescription":
        "type": "EXISTS"
        "properties":
          - "corrosionLoopDescription"
        "name": "corrosionLoopDescription_CorrosionLoop_exists"
      "exists_CorrosionLoop_corrosionLoopProcessDescription":
        "type": "EXISTS"
        "properties":
          - "corrosionLoopProcessDescription"
        "name": "corrosionLoopProcessDescription_CorrosionLoop_exists"
    "extensions":
      "custom":
        "cfihosCode": "CFIHOS-00000010"
        "section": "A.2.11"
        "dataSource": "Owner/Operator"
  "CorrosionLoopType":
    "labels":
      "identifier": "CorrosionLoopType"
    "description": "A classification of corrosion loops."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000011"
    "properties":
      "corrosionLoopTypeCode":
        "type": "STRING"
        "name": "corrosionLoopTypeCode"
        "description": "A code that uniquely identifies the type of corrosion loop. At most 10 characters."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000023"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000023"
            "format": "Text, max 10 characters"
            "requirement": "Identifier"
      "corrosionLoopTypeName":
        "type": "STRING"
        "name": "corrosionLoopTypeName"
        "description": "The name by which the corrosion loop type is usually designated. At most 100 characters."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000024"
        "pattern": "^[\\s\\S]{0,100}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000024"
            "format": "Text, max 100 characters"
            "requirement": "Mandatory"
    "constraints":
      "key_CorrosionLoopType":
        "type": "KEY"
        "properties":
          - "corrosionLoopTypeCode"
        "name": "corrosionLoopTypeCode_CorrosionLoopType_key"
      "exists_CorrosionLoopType_corrosionLoopTypeName":
        "type": "EXISTS"
        "properties":
          - "corrosionLoopTypeName"
        "name": "corrosionLoopTypeName_CorrosionLoopType_exists"
    "extensions":
      "custom":
        "cfihosCode": "CFIHOS-00000011"
        "section": "A.2.12"
        "dataSource": "Owner/Operator"
  "Tag":
    "labels":
      "identifier": "Tag"
    "description": "An object designed for performing functional requirements and serving as a specification for equipment."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000028"
    "properties":
      "plantCode":
        "type": "STRING"
        "name": "plantCode"
        "description": "The plant where the tag is or will be located. Must be present in PROCESS UNIT. At most 40 characters. e.g. `6000`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000005"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000005"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "tagName":
        "type": "STRING"
        "name": "tagName"
        "description": "The full name of a tag. At most 33 characters. e.g. `036FV001`. Different companies have different tag naming conventions. A tag name shall be unique within a plant."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000166"
        "pattern": "^[\\s\\S]{0,33}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000166"
            "format": "Text, max 33 characters"
            "requirement": "Identifier"
      "tagDescription":
        "type": "STRING"
        "name": "tagDescription"
        "description": "A functional description of the tag. At most 255 characters. e.g. `'Hot Oil Circulation Pump' that clearly describes the function of the pump (the equipment assigned can be centrifugal or reciprocating pump). 'V 431 Separator Relief Valve' that clearly describes the function of the valve, with additional parent related information.`. The description can also include the parent tag, where required. It should not include tag class, manufacturer and model information."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000177"
        "pattern": "^[\\s\\S]{0,255}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000177"
            "format": "Text, max 255 characters"
            "requirement": "Mandatory"
      "parentTagName":
        "type": "STRING"
        "name": "parentTagName"
        "description": "An identification of the parentage of the tag. Must be present in TAG. At most 33 characters. e.g. `600-036F001`. The parent tag (also called main tag) can be a package, an instrument loop or an electrical circuit."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000178"
        "pattern": "^[\\s\\S]{0,33}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000178"
            "format": "Text, max 33 characters"
            "requirement": "Optional"
      "processUnitCode":
        "type": "STRING"
        "name": "processUnitCode"
        "description": "The process unit within the plant to which the tag provides part of the functionality. Must be present in PROCESS UNIT. At most 40 characters. e.g. `36`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000157"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000157"
            "format": "Text, max 40 characters"
            "requirement": "Mandatory"
      "areaCode":
        "type": "STRING"
        "name": "areaCode"
        "description": "The geographical area within the plant where the tag is located. Must be present in AREA. At most 10 characters. e.g. `Topsides`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000001"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000001"
            "format": "Text, max 10 characters"
            "requirement": "Optional"
      "constructionAssemblyCode":
        "type": "STRING"
        "name": "constructionAssemblyCode"
        "description": "The construction assembly of a plant where the tag resides. Must be present in CONSTRUCTION ASSEMBLY. At most 10 characters. e.g. `CIU`. This should be a leaf node construction assembly."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000130"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000130"
            "format": "Text, max 10 characters"
            "requirement": "Optional"
      "commissioningUnitCode":
        "type": "STRING"
        "name": "commissioningUnitCode"
        "description": "The unit that will or has commissioned the tag. Must be present in LEAF NODE COMMISSIONING UNIT. At most 10 characters. e.g. `980`. This should be a leaf node commissioning unit."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000009"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000009"
            "format": "Text, max 10 characters"
            "requirement": "Optional"
      "maintenanceUnitCode":
        "type": "STRING"
        "name": "maintenanceUnitCode"
        "description": "The unit that is in charge of maintaining the tag. Must be present in MAINTENANCE SYSTEM. At most 10 characters. e.g. `KZ.KAS.H01.B02`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000013"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000013"
            "format": "Text, max 10 characters"
            "requirement": "Optional"
      "maintenanceSystemCode":
        "type": "STRING"
        "name": "maintenanceSystemCode"
        "description": "The maintenance system through which the tag is maintained. Must be present in MAINTENANCE SYSTEM. At most 10 characters. e.g. `A01.01`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000015"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000015"
            "format": "Text, max 10 characters"
            "requirement": "Optional"
      "corrosionLoopCode":
        "type": "STRING"
        "name": "corrosionLoopCode"
        "description": "The corrosion loop that includes the tag. Must be present in CORROSION LOOP. At most 40 characters. e.g. `CL1101`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000018"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000018"
            "format": "Text, max 40 characters"
            "requirement": "Optional"
      "tagClassName":
        "type": "STRING"
        "name": "tagClassName"
        "description": "The full name of the tag or equipment class. Must be present in TAG CLASS. At most 100 characters. e.g. `control panel`. The initial set of values will be the CFIHOS unique ids that were assigned to tag classes."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000040"
        "pattern": "^[\\s\\S]{0,100}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000040"
            "format": "Text, max 100 characters"
            "requirement": "Mandatory"
      "tagStatus":
        "type": "STRING"
        "name": "tagStatus"
        "description": "An identification of the engineering phase in which the tag is. Must be present in ENGINEERING STATUS. At most 40 characters. e.g. `ASB`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000025"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000025"
            "format": "Text, max 40 characters"
            "requirement": "Mandatory"
      "tagRequisitionNumber":
        "type": "STRING"
        "name": "tagRequisitionNumber"
        "description": "A requisition number that has been placed to acquire the tag. At most 50 characters. e.g. `1234567`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000026"
        "pattern": "^[\\s\\S]{0,50}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000026"
            "format": "Text, max 50 characters"
            "requirement": "Optional"
      "designedByCompanyName":
        "type": "STRING"
        "name": "designedByCompanyName"
        "description": "The company responsible for the design of the tag. Must be present in COMPANY. At most 30 characters. e.g. `KWAC`. It is sometimes extracted from maintenance management system. The owner / operator and the EPC company need to align on the name of companies."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000179"
        "pattern": "^[\\s\\S]{0,30}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000179"
            "format": "Text, max 30 characters"
            "requirement": "Mandatory"
      "productionCriticalItemIndicator":
        "type": "BOOLEAN"
        "name": "productionCriticalItemIndicator"
        "description": "An indication whether the loss of the functionality provided by the tag would have an immediate cost impact, like a loss of production. e.g. `Yes`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000027"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000027"
            "format": "Boolean (Yes/No)"
            "requirement": "Mandatory"
      "safetyCriticalItemIndicator":
        "type": "BOOLEAN"
        "name": "safetyCriticalItemIndicator"
        "description": "An indication whether the tag should be considered as a safety critical element, as per International Standards. e.g. `Yes`. Safety Critical Elements (SCEs) are those elements of risk barriers, including equipment, hardware, and related control systems, for which : - the failure of which could lead to a major accident or event, or - that mitigate the consequences of a major accident or event. The basis for the selection of SCEs is the assessment of Major Accidents identified in each Asset HSE Case or those documents that support the Case."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000028"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000028"
            "format": "Boolean (Yes/No)"
            "requirement": "Mandatory"
      "safetyCriticalItemGroupCode":
        "type": "STRING"
        "name": "safetyCriticalItemGroupCode"
        "description": "The safety critical item group assigned to the tag, and identified according to International Standard. Must be present in SAFETY CRITICAL ITEM GROUP. At most 40 characters. e.g. `DS001`. This is only required if safety critical item indicator =Yes."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000029"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000029"
            "format": "Text, max 40 characters"
            "requirement": "Optional"
      "safetyCriticalItemReasonAwarded":
        "type": "STRING"
        "name": "safetyCriticalItemReasonAwarded"
        "description": "A documentation of the outcome of the SCE assessment. At most 30 characters. e.g. `from safety case`. This is only required if safety critical item indicator =Yes. It is populated according to International Standard."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000030"
        "pattern": "^[\\s\\S]{0,30}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000030"
            "format": "Text, max 30 characters"
            "requirement": "Optional"
      "manufacturerCompanyName":
        "type": "STRING"
        "name": "manufacturerCompanyName"
        "description": "A name used to uniquely identify the company who manufactures the model / part. Must be present in MODEL PART. At most 30 characters. e.g. `Flowserve`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000158"
        "pattern": "^[\\s\\S]{0,30}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000158"
            "format": "Text, max 30 characters"
            "requirement": "Optional"
      "modelPartName":
        "type": "STRING"
        "name": "modelPartName"
        "description": "A unique name to identify the model part of the manufacturer. Must be present in MODEL PART. At most 100 characters. e.g. `A4 V726 PN 40`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000159"
        "pattern": "^[\\s\\S]{0,100}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000159"
            "format": "Text, max 100 characters"
            "requirement": "Optional"
    "constraints":
      "key_Tag":
        "type": "KEY"
        "properties":
          - "plantCode"
          - "tagName"
        "name": "plantCode_tagName_Tag_key"
      "exists_Tag_tagDescription":
        "type": "EXISTS"
        "properties":
          - "tagDescription"
        "name": "tagDescription_Tag_exists"
      "exists_Tag_processUnitCode":
        "type": "EXISTS"
        "properties":
          - "processUnitCode"
        "name": "processUnitCode_Tag_exists"
      "exists_Tag_tagClassName":
        "type": "EXISTS"
        "properties":
          - "tagClassName"
        "name": "tagClassName_Tag_exists"
      "exists_Tag_tagStatus":
        "type": "EXISTS"
        "properties":
          - "tagStatus"
        "name": "tagStatus_Tag_exists"
      "exists_Tag_designedByCompanyName":
        "type": "EXISTS"
        "properties":
          - "designedByCompanyName"
        "name": "designedByCompanyName_Tag_exists"
      "exists_Tag_productionCriticalItemIndicator":
        "type": "EXISTS"
        "properties":
          - "productionCriticalItemIndicator"
        "name": "productionCriticalItemIndicator_Tag_exists"
      "exists_Tag_safetyCriticalItemIndicator":
        "type": "EXISTS"
        "properties":
          - "safetyCriticalItemIndicator"
        "name": "safetyCriticalItemIndicator_Tag_exists"
    "extensions":
      "custom":
        "cfihosCode": "CFIHOS-00000028"
        "section": "A.2.13"
        "dataSource": "EPC"
  "TagAlias":
    "labels":
      "identifier": "TagAlias"
    "description": "An alternate name under which a tag may be designated. These aliases are exchanged between the parties. Their origin may be historical, or alternate naming used by the different parties. But they should always have mapping to the official tag name."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000144"
    "properties":
      "plantCode":
        "type": "STRING"
        "name": "plantCode"
        "description": "The plant where the tag is or will be located. Must be present in TAG. At most 40 characters. e.g. `6000`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000005"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000005"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "tagAliasName":
        "type": "STRING"
        "name": "tagAliasName"
        "description": "The legacy/alternate name given to the tag. This may be a name from a Contractor/Vendor or it could be an old name assigned by the Owner Operator. At most 40 characters. e.g. `PM-2012`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000379"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000379"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "tagName":
        "type": "STRING"
        "name": "tagName"
        "description": "The full name of a tag. Must be present in TAG. At most 33 characters. e.g. `036FV001`. Different companies have different tag naming conventions. A tag name shall be unique within a plant."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000166"
        "pattern": "^[\\s\\S]{0,33}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000166"
            "format": "Text, max 33 characters"
            "requirement": "Identifier"
    "constraints":
      "key_TagAlias":
        "type": "KEY"
        "properties":
          - "plantCode"
          - "tagAliasName"
          - "tagName"
        "name": "plantCode_tagAliasName_tagName_TagAlias_key"
    "extensions":
      "custom":
        "cfihosCode": "CFIHOS-00000144"
        "section": "A.2.14"
        "dataSource": "Owner/Operator"
  "IndustrialComplex":
    "labels":
      "identifier": "IndustrialComplex"
    "description": "A number of discrete or interconnected plants, together with the associated buildings. Definition inspired by ISO 10209 term 'Industrial Complex'. In ISO 15926 RDL it is defined by INDUSTRIAL COMPLEX."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000138"
    "properties":
      "industrialComplexCode":
        "type": "STRING"
        "name": "industrialComplexCode"
        "description": "A code that uniquely identifies the industrial complex. At most 40 characters. e.g. `LCC`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000367"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
