  "TagPhysicalConnection":
    "labels":
      "identifier": "TagPhysicalConnection"
    "description": "A physical connection between tags. This information is primarily used for mechanical completions. For piping this information can be generated from 3D models. For electrical and instrumentation, this information can be generated from design tools. For pipes, the direction From To is the direction of the flow within the pipe. For electrical cables, the direction From To is the direction of the electrical current. For drivers (e.g., electrical motor), the From To is the direction of the flow of energy, consistent with ISO15926 and ISO22274. For an instrument having only one connection, the From is the Tag the instrument is mounted on (e.g., the vessel). For a valve, not causing a line break, the From is the line the valve is mounted on. For auxiliary equipment (e.g., a filter), the From is the Tag where the auxiliary equipment is mounted on."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000038"
    "properties":
      "fromPlantCode":
        "type": "STRING"
        "name": "fromPlantCode"
        "description": "The plant the process unit is part of, and to which the originating tag belongs. Must be present in TAG. At most 40 characters. e.g. `6000`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000181"
        "pattern": "^[\\s\\S]{0,40}$"
