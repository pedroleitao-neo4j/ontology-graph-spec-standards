        "description": "The reason for issuing the transmittal. Must be present in REASON FOR ISSUE. At most 40 characters. e.g. `issued for information`. The reason for issuing a transmittal is independent of the statuses of the document revisions that the transmittal includes."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000142"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000142"
            "format": "Text, max 40 characters"
            "requirement": "Mandatory"
    "constraints":
