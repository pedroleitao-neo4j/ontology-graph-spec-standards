      "submitForReviewIndicator":
        "type": "BOOLEAN"
        "name": "submitForReviewIndicator"
        "description": "An indication whether documents having for content this VDDR shall be submitted by the Vendor for review or not. e.g. `Yes`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000309"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000309"
            "format": "Boolean (Yes/No)"
