      "transmittalSendDate":
        "type": "DATE"
        "name": "transmittalSendDate"
        "description": "The date of sending the transmittal. e.g. `2022-11-15`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000144"
