            "requirement": "Optional"
    "constraints":
      "key_DocumentReviewType":
        "type": "KEY"
        "properties":
          - "documentReviewTypeCode"
        "name": "documentReviewTypeCode_DocumentReviewType_key"
    "extensions":
      "custom":
        "cfihosCode": "CFIHOS-00000060"
        "section": "A.7.04"
        "dataSource": "RDL Pick list"
  "DocumentRevision":
    "labels":
      "identifier": "DocumentRevision"
    "description": "A user-readable set of data structured in order to be printed and stored as a whole (includes drawings). Disciplines specify the content of the documents delivered. The file provided (See FILE_NAME property) shall be: - The most used rendition (when than one rendition is given for the same document). - The entry point for the document (e.g., the table of content, when the document has been split into multiple files). Remark: - All files generated in PDF format shall be text-searchable with commenting enabled. - All files shall be fully virus checked by the Contractor before submission."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000035"
    "properties":
      "documentNumber":
        "type": "STRING"
        "name": "documentNumber"
        "description": "The document master to which this revision is related. Must be present in DOCUMENT MASTER. At most 40 characters. e.g. `KC01-71-990-KW-T-YP-0002-000`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000154"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000154"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "documentRevisionCode":
        "type": "STRING"
        "name": "documentRevisionCode"
        "description": "A code used to identify the content of a document at a certain point in time. At most 5 characters. e.g. `001`. It is used to track the evolution of a document during its lifecycle and is applied at time of release from Originator to reflect the document is frozen."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000162"
        "pattern": "^[\\s\\S]{0,5}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000162"
            "format": "Text, max 5 characters"
            "requirement": "Identifier"
      "documentRevisionDate":
        "type": "DATE"
        "name": "documentRevisionDate"
        "description": "The date the document was revised. e.g. `2022-11-15`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000076"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000076"
            "format": "Date"
            "requirement": "Mandatory"
      "documentRevisionAuthor":
        "type": "STRING"
        "name": "documentRevisionAuthor"
        "description": "The name of the person who created the document revision. At most 70 characters. e.g. `John Stephen`. This should be an individual name, not a role, i.e. Initials and last name, not just initials."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000078"
        "pattern": "^[\\s\\S]{0,70}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000078"
            "format": "Text, max 70 characters"
            "requirement": "Optional"
      "documentRevisionApprover":
        "type": "STRING"
        "name": "documentRevisionApprover"
        "description": "The name (or the User ID) of the person who has approved the document revision. At most 50 characters. e.g. `Marc Brown`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000079"
        "pattern": "^[\\s\\S]{0,50}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000079"
            "format": "Text, max 50 characters"
            "requirement": "Optional"
      "documentRevisionFileName":
        "type": "STRING"
        "name": "documentRevisionFileName"
        "description": "The name of the electronic file (including the file extension) with the full path. At most 255 characters. e.g. `P-36-03-D-8120-01-D-01.pdf`. The file name shall consist of the document number, Document revision and a sequence number followed by the file extension. When this attribute is populated the attribute physical storage location shall be left empty."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000080"
        "pattern": "^[\\s\\S]{0,255}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000080"
            "format": "Text, max 255 characters"
            "requirement": "Optional"
      "originatorDocumentNumber":
        "type": "STRING"
        "name": "originatorDocumentNumber"
        "description": "The unique identifier for the Document according to the originator document numbering scheme. At most 40 characters. e.g. `ECO-001-0045-978`. One potential use is to allow Owner/Operator to identify duplicate documents provided by multiple subcontractors but from the same OEM."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000160"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000160"
            "format": "Text, max 40 characters"
            "requirement": "Optional"
      "originatorDocumentRevisionCode":
        "type": "STRING"
        "name": "originatorDocumentRevisionCode"
        "description": "A code used to identify the content of a document at a certain point in time according to the originator which doesn't necessarily conform to the Owner/Operator's document revision coding scheme. At most 5 characters. e.g. `00013`. One potential use is to allow Owner/Operator to identify duplicate documents provided by multiple subcontractors but from the same OEM."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000081"
        "pattern": "^[\\s\\S]{0,5}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000081"
            "format": "Text, max 5 characters"
            "requirement": "Optional"
      "originatorFileName":
        "type": "STRING"
        "name": "originatorFileName"
        "description": "The name of the file as provided by the manufacturer. At most 255 characters. e.g. `P-36-03-D-8120-01-D-01.pdf`. Remark: One potential use is to allow Owner/Operator to identify duplicate documents provided by multiple subcontractors but from the same OEM. This document shall not contain any project specific cover page, but only the manufacturer cover page."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000082"
        "pattern": "^[\\s\\S]{0,255}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000082"
            "format": "Text, max 255 characters"
            "requirement": "Optional"
      "documentStatusCode":
        "type": "STRING"
        "name": "documentStatusCode"
        "description": "A code that uniquely identifies the status of document revisions. Must be present in DOCUMENT STATUS. At most 40 characters. e.g. `ASB`. A document is classified by a single state, which changes as the document advances through this lifecycle."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000083"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000083"
            "format": "Text, max 40 characters"
            "requirement": "Optional"
      "isoLanguageCode":
        "type": "STRING"
        "name": "isoLanguageCode"
        "description": "The primary language that the document revision is written in. Must be present in ISO LANGUAGE. At most 2 characters. e.g. `EN`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000147"
        "pattern": "^[\\s\\S]{0,2}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000147"
            "format": "Text, max 2 characters"
            "requirement": "Optional"
      "documentRevisionComment":
        "type": "STRING"
        "name": "documentRevisionComment"
        "description": "Any additional comment / explanation for a document revision. At most 255 characters. e.g. `Does not include package A-1001`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000085"
        "pattern": "^[\\s\\S]{0,255}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000085"
            "format": "Text, max 255 characters"
            "requirement": "Optional"
      "plantCode":
        "type": "STRING"
        "name": "plantCode"
        "description": "The plant that the document revision is related to. Must be present in PLANT. At most 40 characters. e.g. `6000`. This is a very 'high level' grouping of documents used to segregate documents dealing with different Plants. 'Low level' document references shall also be provided for the Document (See 'Document References')."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000005"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000005"
            "format": "Text, max 40 characters"
            "requirement": "Mandatory"
      "exportControlClassification":
        "type": "STRING"
        "name": "exportControlClassification"
        "description": "The Export Control Rule that is applicable for the document revision (e.g., ECCN, EAR). Must be present in EXPORT CONTROL CLASSIFICATION. At most 40 characters. e.g. `Controlled Content`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000086"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000086"
            "format": "Text, max 40 characters"
            "requirement": "Optional"
      "originatorCompany":
        "type": "STRING"
        "name": "originatorCompany"
        "description": "The name of the company who has generated the document revision. Must be present in COMPANY. At most 30 characters. e.g. `Engineering and co Ltd`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000077"
        "pattern": "^[\\s\\S]{0,30}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000077"
            "format": "Text, max 30 characters"
            "requirement": "Mandatory"
      "projectCode":
        "type": "STRING"
        "name": "projectCode"
        "description": "The code that identifies the project the document revision refers to. Must be present in PROJECT. At most 10 characters. e.g. `FPSO B23`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000161"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000161"
            "format": "Text, max 10 characters"
            "requirement": "Optional"
      "transmittalNumber":
        "type": "STRING"
        "name": "transmittalNumber"
        "description": "The transmittal through which this document revision was communicated. Must be present in TRANSMITTAL. At most 100 characters. e.g. `FFDF-2007-0071-TE-SH-KW-01149`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000087"
        "pattern": "^[\\s\\S]{0,100}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000087"
            "format": "Text, max 100 characters"
            "requirement": "Optional"
      "documentRevisionRecipient":
        "type": "STRING"
        "name": "documentRevisionRecipient"
        "description": "The full name of the recipient of the document. revision. At most 70 characters. e.g. `O.Paap`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000091"
        "pattern": "^[\\s\\S]{0,70}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000091"
            "format": "Text, max 70 characters"
            "requirement": "Optional"
      "actualReviewDate":
        "type": "DATE"
        "name": "actualReviewDate"
        "description": "The date on which the document revision was actually reviewed. e.g. `2022-11-15`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000066"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000066"
            "format": "Date"
            "requirement": "Optional"
      "actualApprovalDate":
        "type": "DATE"
        "name": "actualApprovalDate"
        "description": "The date at which the document revision has been issued for approval. e.g. `2022-11-15`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000068"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000068"
            "format": "Date"
            "requirement": "Optional"
      "actualApprovedForDesignDate":
        "type": "DATE"
        "name": "actualApprovedForDesignDate"
        "description": "The date at which the document revision has been issued approved for design. e.g. `2022-11-15`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000070"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000070"
            "format": "Date"
            "requirement": "Optional"
      "actualApprovedForConstructionDate":
        "type": "DATE"
        "name": "actualApprovedForConstructionDate"
        "description": "The date at which the document revision has been issued approved for construction. e.g. `2022-11-15`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000072"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000072"
            "format": "Date"
            "requirement": "Optional"
      "actualAsBuiltDate":
        "type": "DATE"
        "name": "actualAsBuiltDate"
        "description": "The date at which the document revision has been issued as-built. e.g. `2022-11-15`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000074"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000074"
            "format": "Date"
            "requirement": "Optional"
      "documentRevisionPhysicalStorageLocation":
        "type": "STRING"
        "name": "documentRevisionPhysicalStorageLocation"
        "description": "The location of a media when not stored as an electronic file. At most 40 characters. e.g. `Box1523`. When this field is populated the attribute file name shall be left empty."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000093"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000093"
            "format": "Text, max 40 characters"
            "requirement": "Optional"
      "storageMedia":
        "type": "STRING"
        "name": "storageMedia"
        "description": "An Indication of the media type used for storing the content. of the document revision. Must be present in STORAGE MEDIA. At most 40 characters. e.g. `Paper`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000094"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000094"
            "format": "Text, max 40 characters"
            "requirement": "Mandatory"
      "projectStage":
        "type": "STRING"
        "name": "projectStage"
        "description": "A code that uniquely identifies the stage of projects. Must be present in PROJECT STAGE. At most 40 characters. e.g. `D`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000096"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000096"
            "format": "Text, max 40 characters"
            "requirement": "Optional"
      "regulatoryRequiredIndicator":
        "type": "BOOLEAN"
        "name": "regulatoryRequiredIndicator"
        "description": "An indication whether this document is to be developed to meet regulatory compliance requirements. e.g. `Yes`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000195"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000195"
            "format": "Boolean (Yes/No)"
            "requirement": "Mandatory"
      "documentReturnStatusCode":
        "type": "STRING"
        "name": "documentReturnStatusCode"
        "description": "A status assigned to a document revision after review. Must be present in DOCUMENT RETURN STATUS. At most 40 characters. e.g. `Approved`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000375"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000375"
            "format": "Text, max 40 characters"
            "requirement": "Optional"
    "constraints":
      "key_DocumentRevision":
        "type": "KEY"
        "properties":
          - "documentNumber"
          - "documentRevisionCode"
        "name": "documentNumber_documentRevisionCode_DocumentRevision_key"
      "exists_DocumentRevision_documentRevisionDate":
        "type": "EXISTS"
        "properties":
          - "documentRevisionDate"
        "name": "documentRevisionDate_DocumentRevision_exists"
      "exists_DocumentRevision_plantCode":
        "type": "EXISTS"
        "properties":
          - "plantCode"
        "name": "plantCode_DocumentRevision_exists"
      "exists_DocumentRevision_originatorCompany":
        "type": "EXISTS"
        "properties":
          - "originatorCompany"
        "name": "originatorCompany_DocumentRevision_exists"
      "exists_DocumentRevision_storageMedia":
        "type": "EXISTS"
        "properties":
          - "storageMedia"
        "name": "storageMedia_DocumentRevision_exists"
      "exists_DocumentRevision_regulatoryRequiredIndicator":
        "type": "EXISTS"
        "properties":
          - "regulatoryRequiredIndicator"
        "name": "regulatoryRequiredIndicator_DocumentRevision_exists"
    "extensions":
      "custom":
        "cfihosCode": "CFIHOS-00000035"
        "section": "A.8.01"
        "dataSource": "EPC"
  "Transmittal":
    "labels":
      "identifier": "Transmittal"
    "description": "An exchange of information between two companies."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000024"
    "properties":
      "sendingCompanyName":
        "type": "STRING"
        "name": "sendingCompanyName"
        "description": "The name of the company who has sent the transmittal. Must be present in COMPANY. At most 30 characters. e.g. `Flowserve`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000252"
        "pattern": "^[\\s\\S]{0,30}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000252"
            "format": "Text, max 30 characters"
            "requirement": "Identifier"
      "projectCode":
        "type": "STRING"
        "name": "projectCode"
        "description": "The project for which the transmittal has been issued. Must be present in PROJECT. At most 10 characters. e.g. `FLNG`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000161"
        "pattern": "^[\\s\\S]{0,10}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000161"
