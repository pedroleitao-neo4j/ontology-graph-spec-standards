  "TagProperty":
    "labels":
      "identifier": "TagProperty"
    "description": "A characteristic, or property, that a tag has."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000015"
    "properties":
      "plantCode":
        "type": "STRING"
        "name": "plantCode"
        "description": "The plant where the tag will be installed. Must be present in TAG. At most 40 characters. e.g. `6000`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000005"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000005"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "tagName":
        "type": "STRING"
        "name": "tagName"
        "description": "The full name of a tag. Must be present in TAG. At most 33 characters. e.g. `036FV001`. Different companies have different tag naming conventions. A tag name shall be unique within a plant."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000166"
        "pattern": "^[\\s\\S]{0,33}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000166"
            "format": "Text, max 33 characters"
            "requirement": "Identifier"
      "propertyName":
        "type": "STRING"
        "name": "propertyName"
        "description": "A name that uniquely identifies the property. Must be present in PROPERTY. At most 100 characters. e.g. `normal operating pressure`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000056"
        "pattern": "^[\\s\\S]{0,100}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000056"
            "format": "Text, max 100 characters"
            "requirement": "Mandatory"
      "tagPropertyValue":
        "type": "STRING"
        "name": "tagPropertyValue"
        "description": "The value of the property for that tag. At most 100 characters. e.g. `220`. The data type of that value must be aligned with the data type of the property. Moreover, if the property is numeric, it should be qualified by a unit of measure. If the property is not numeric, and has a pick list associated with the tag property value must be one of the entries in the set of pick list values."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000248"
        "pattern": "^[\\s\\S]{0,100}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000248"
            "format": "Text, max 100 characters"
            "requirement": "Mandatory"
      "tagPropertyMarginRatio":
        "type": "FLOAT"
        "name": "tagPropertyMarginRatio"
        "description": "The total margin that has been applied on the value of the tag property, compared to what was evaluated as the process stream property. e.g. `240`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000333"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000333"
            "format": "NUM"
            "requirement": "Optional"
      "reasonForDeviatingFromStandardUnitOfMeasure":
        "type": "STRING"
        "name": "reasonForDeviatingFromStandardUnitOfMeasure"
        "description": "The reason why the unit of measure as prescribed by the source standard as not been used to report the tag property value. At most 255 characters. e.g. `Size of the value`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000242"
        "pattern": "^[\\s\\S]{0,255}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000242"
            "format": "Text, max 255 characters"
            "requirement": "Optional"
      "processStreamCode":
        "type": "STRING"
        "name": "processStreamCode"
        "description": "The process stream from on which the tag property value is based. Must be present in PROCESS STREAM PROPERTY. At most 40 characters. e.g. `MS_07`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000328"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000328"
            "format": "Text, max 40 characters"
            "requirement": "Optional"
      "processActivityCode":
        "type": "STRING"
        "name": "processActivityCode"
        "description": "A code that uniquely identifies the process / activity. Must be present in PROCESS DESIGN PROPERTY. At most 40 characters. e.g. `PROC_07`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000322"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000322"
            "format": "Text, max 40 characters"
            "requirement": "Optional"
      "unitOfMeasureName":
        "type": "STRING"
        "name": "unitOfMeasureName"
        "description": "The unique name which designates the unit. Must be present in UNIT OF MEASURE. At most 90 characters. e.g. `second`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000238"
        "pattern": "^[\\s\\S]{0,90}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000238"
            "format": "Text, max 90 characters"
            "requirement": "Optional"
    "constraints":
