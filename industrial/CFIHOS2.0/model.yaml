    "labels":
      "identifier": "PurchaseOrderItemVendorDocumentAndDataRequirement"
    "description": "A vendor document and data requirement (VDDR) deemed to be appropriate jointly by the purchaser and the vendor for a given purchase order. The Purchaser specifies for each VDDR the dates at which the Vendor shall send the corresponding information to the purchaser (e.g. issue for review date). During the ITT process the Vendor shall review the PO_VDDR and confirm: - The relevance of the VDDR's requested with regard to the equipment being requisitioned. For packages, the Vendor shall take into account all ancillary equipment, e.g. on a pump package there may be pulsation dampers, which may be deemed to be pressure vessels. -The ability to meet specified VDDR's submittal dates. Following review, the Vendor will make adjustments according to the ITT clarification process regarding the VDDR omissions. The Vendor shall sign the agreed PO_VDDR. After PO award, a revised requisition package will be submitted to the Vendor with a revised PO_VDDR. The Vendor shall sign the revised PO_VDDR."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000108"
    "properties":
      "purchaseOrderIssuerCompanyName":
        "type": "STRING"
        "name": "purchaseOrderIssuerCompanyName"
        "description": "The name of the company issuing the purchase order. Must be present in PURCHASE ORDER ITEM. At most 30 characters. e.g. `Engineering and co Ltd`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000180"
        "pattern": "^[\\s\\S]{0,30}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000180"
            "format": "Text, max 30 characters"
            "requirement": "Identifier"
      "purchaseOrderNumber":
        "type": "STRING"
        "name": "purchaseOrderNumber"
        "description": "A unique code used to identify the purchase order within the company issuing the purchase order. Must be present in PURCHASE ORDER ITEM. At most 50 characters. e.g. `00058`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000128"
        "pattern": "^[\\s\\S]{0,50}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000128"
            "format": "Text, max 50 characters"
            "requirement": "Identifier"
      "purchaseOrderItemNumber":
        "type": "INTEGER"
        "name": "purchaseOrderItemNumber"
        "description": "A code that uniquely identifies an item in a purchase order. Must be present in PURCHASE ORDER ITEM. e.g. `0012`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000299"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000299"
            "format": "Integer"
            "requirement": "Identifier"
      "purchaseOrderVendorDocumentAndDataRequirementNumber":
        "type": "INTEGER"
        "name": "purchaseOrderVendorDocumentAndDataRequirementNumber"
        "description": "A number that uniquely identifies a document and data requirement of a given standard source, in a given purchase order item. e.g. `1`."
