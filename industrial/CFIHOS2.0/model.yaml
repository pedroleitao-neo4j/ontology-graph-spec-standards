        "type": "BOOLEAN"
        "name": "propertyIsRelevantForTagIndicator"
        "description": "An indication that the property is relevant for tags associated with the class. e.g. `Yes`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000262"
