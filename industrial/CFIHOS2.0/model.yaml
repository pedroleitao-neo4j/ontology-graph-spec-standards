        "description": "The number of weeks that, by default, should be used, by the vendor, vs the reference date, to provide documents containing this VDDR for approval. e.g. `2`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000277"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000277"
            "format": "Integer"
            "requirement": "Optional"
      "defaultIssueForApprovalReferenceDate":
        "type": "STRING"
        "name": "defaultIssueForApprovalReferenceDate"
        "description": "The reference date used for the approval. Must be present in SUBMISSION REFERENCE DATE. At most 40 characters. e.g. `WPTD`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000278"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
