        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000307"
            "format": "Integer"
            "requirement": "Identifier"
      "sourceStandardCode":
        "type": "STRING"
        "name": "sourceStandardCode"
        "description": "A code used to designate the standard used to define requirements like engineering, operations, etc. Must be present in SOURCE STANDARD DOCUMENT AND DATA REQUIREMENT. At most 40 characters. e.g. `ISO 13533`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000053"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
