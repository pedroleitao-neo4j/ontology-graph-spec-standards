  "SourceStandardDocumentAndDataRequirement":
    "labels":
      "identifier": "SourceStandardDocumentAndDataRequirement"
    "description": "A requirement for document or data, as expressed in a source standard, irrespective of the equipment class. These Document and Data Requirements are of two kinds: 1) Design: Information generated during the design activity that has to be approved and reviewed by the purchaser. 2) Equipment: Information generated by the equipment manufacturer. This entity represents how to best manage this data, as all document and data requirements expressed in a standard are independent of the equipment classes the standard is covering. In the RDL, this table only contains the entries for document and data requirements as expressed in public standards. Owners / operators are expected to download them in their database, and then to complement that list with their own document and data requirements for their standards."
    "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-00000132"
    "properties":
      "sourceStandardCode":
        "type": "STRING"
        "name": "sourceStandardCode"
        "description": "A code used to designate the standard used to define requirements like engineering, operations, etc. Must be present in SOURCE STANDARD. At most 40 characters. e.g. `ISO 13533`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000053"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000053"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "sourceStandardDocumentAndDataRequirementNumber":
        "type": "STRING"
        "name": "sourceStandardDocumentAndDataRequirementNumber"
        "description": "A number, assigned sequentially, to associate the VDDR to the engineering standard. At most 40 characters. e.g. `11`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000267"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000267"
            "format": "Text, max 40 characters"
            "requirement": "Identifier"
      "sourceStandardDocumentAndDataRequirementTitle":
        "type": "STRING"
        "name": "sourceStandardDocumentAndDataRequirementTitle"
        "description": "The title, as spelled in the engineering standard, of the VDDR. At most 150 characters. e.g. `Anticipated thermal movements for major connections`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000268"
        "pattern": "^[\\s\\S]{0,150}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000268"
            "format": "Text, max 150 characters"
            "requirement": "Optional"
      "sourceStandardDocumentAndDataRequirementTypicalDeliverable":
        "type": "STRING"
        "name": "sourceStandardDocumentAndDataRequirementTypicalDeliverable"
        "description": "A short description of the information deliverable that would typically include this document and data requirement. At most 150 characters. e.g. `Quality Plan`. This field uses CFIHOS naming as much as possible, and is aligned as much as possible with the JIP33 library of typical deliverable."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000269"
        "pattern": "^[\\s\\S]{0,150}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000269"
            "format": "Text, max 150 characters"
            "requirement": "Optional"
      "sourceStandardDocumentAndDataRequirementDescription":
        "type": "STRING"
        "name": "sourceStandardDocumentAndDataRequirementDescription"
        "description": "A precise description, as documented in the engineering standard, of the VDDR in term of what the content of the document shall be. At most 2048 characters. e.g. `The seal cross-sectional drawing shall include at least the following information: a) all seal components related to the order as well as pump components related to the seal. b) dimensions to properly verify the seal setting position. c) Pump dimensions interfacing with the seal. d) Seal boundary dimensions. e) Seal Chamber and gland-plate connection dimensions. f) Auxiliary system and utility specifications. g) Connecting dimensions for the auxiliary system and utilities. h) [...]`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000270"
        "pattern": "^[\\s\\S]{0,2048}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000270"
            "format": "Text, max 2048 characters"
            "requirement": "Optional"
      "documentAndDataRequirementTypeCode":
        "type": "STRING"
        "name": "documentAndDataRequirementTypeCode"
        "description": "A code that uniquely identifies the type of document and data requirement. Must be present in DOCUMENT AND DATA REQUIREMENT TYPE. At most 40 characters. e.g. `Design`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000289"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000289"
            "format": "Text, max 40 characters"
            "requirement": "Optional"
      "documentAndDataRequirementGroupCode":
        "type": "STRING"
        "name": "documentAndDataRequirementGroupCode"
        "description": "A code that uniquely identifies the group to which a vendor document and data requirement belongs. Must be present in DOCUMENT AND DATA REQUIREMENT GROUP. At most 40 characters. e.g. `Technical`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000291"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000291"
            "format": "Text, max 40 characters"
            "requirement": "Mandatory"
      "engineeringStandardSourceChapter":
        "type": "STRING"
        "name": "engineeringStandardSourceChapter"
        "description": "The chapter of the engineering standard from which originates the VDDR. At most 255 characters. e.g. `Annex 11`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000271"
        "pattern": "^[\\s\\S]{0,255}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000271"
            "format": "Text, max 255 characters"
            "requirement": "Optional"
      "disciplineCode":
        "type": "STRING"
        "name": "disciplineCode"
        "description": "A code that uniquely identifies a discipline. Must be present in DISCIPLINE. At most 2 characters. e.g. `MP`. The discipline / document type documented from the RDL could be overwritten by the Owner / Operator."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000153"
        "pattern": "^[\\s\\S]{0,2}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000153"
            "format": "Text, max 2 characters"
            "requirement": "Optional"
      "documentTypeShortCode":
        "type": "STRING"
        "name": "documentTypeShortCode"
        "description": "A code that uniquely identifies a document type. Must be present in DOCUMENT TYPE. At most 4 characters. e.g. `6067`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000100"
        "pattern": "^[\\s\\S]{0,4}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000100"
            "format": "Text, max 4 characters"
            "requirement": "Optional"
      "defaultSubmitAtProposalIndicator":
        "type": "BOOLEAN"
        "name": "defaultSubmitAtProposalIndicator"
        "description": "An indicator whether documents having for content this VDDR shall be submitted by the Vendor during the ITT process. Or not. e.g. `Yes`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000272"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000272"
            "format": "Boolean (Yes/No)"
            "requirement": "Optional"
      "defaultSubmitForReviewIndicator":
        "type": "BOOLEAN"
        "name": "defaultSubmitForReviewIndicator"
        "description": "An indication whether documents having for content this requirement shall be submitted by the vendor for review or not. e.g. `Yes`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000273"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000273"
            "format": "Boolean (Yes/No)"
            "requirement": "Optional"
      "defaultSubmitAtDeliveryIndicator":
        "type": "BOOLEAN"
        "name": "defaultSubmitAtDeliveryIndicator"
        "description": "An indicator whether document having for content this VDDR shall be delivered by the Vendor at the same time as the delivery of the material or service. e.g. `Yes`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000274"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000274"
            "format": "Boolean (Yes/No)"
            "requirement": "Optional"
      "defaultIssueForReviewNumberOfWeeks":
        "type": "INTEGER"
        "name": "defaultIssueForReviewNumberOfWeeks"
        "description": "The number of weeks that, by default, should be used, by the vendor, vs the reference date, to provide documents containing this VDDR for review. e.g. `2`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000275"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000275"
            "format": "Integer"
            "requirement": "Optional"
      "defaultIssueForReviewReferenceDate":
        "type": "STRING"
        "name": "defaultIssueForReviewReferenceDate"
        "description": "The reference date used for the review. Must be present in SUBMISSION REFERENCE DATE. At most 40 characters. e.g. `WPTD`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000276"
        "pattern": "^[\\s\\S]{0,40}$"
