            "cfihosCode": "CFIHOS-10000053"
            "format": "Text, max 40 characters"
            "requirement": "Optional"
      "sourceStandardDocumentAndDataRequirementNumber":
        "type": "STRING"
        "name": "sourceStandardDocumentAndDataRequirementNumber"
        "description": "A number, assigned sequentially, to associate the VDDR to the engineering standard. Must be present in SOURCE STANDARD DOCUMENT AND DATA REQUIREMENT. At most 40 characters. e.g. `11`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000267"
        "pattern": "^[\\s\\S]{0,40}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000267"
            "format": "Text, max 40 characters"
            "requirement": "Optional"
      "submitAtProposalIndicator":
        "type": "BOOLEAN"
        "name": "submitAtProposalIndicator"
        "description": "An indication whether documents having for content this VDDR shall be submitted by the Vendor during the ITT process or not. e.g. `Yes`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000308"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000308"
            "format": "Boolean (Yes/No)"
