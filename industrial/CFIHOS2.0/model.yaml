      "exists_DocumentMaster_documentTitle":
        "type": "EXISTS"
        "properties":
          - "documentTitle"
        "name": "documentTitle_DocumentMaster_exists"
      "exists_DocumentMaster_disciplineDocumentTypeShortCode":
        "type": "EXISTS"
        "properties":
          - "disciplineDocumentTypeShortCode"
        "name": "disciplineDocumentTypeShortCode_DocumentMaster_exists"
      "exists_DocumentMaster_documentReviewType":
        "type": "EXISTS"
