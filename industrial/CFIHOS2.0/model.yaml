      "transmittalNumber":
        "type": "STRING"
        "name": "transmittalNumber"
        "description": "A unique transmittal identifier generated by the document control system of the company sending the transmittal. At most 100 characters. e.g. `FFDF-2007-0071-TE-SH-KW-01149`."
        "reference": "https://www.posccaesar.org/cfihos/v2.0/CFIHOS-10000087"
        "pattern": "^[\\s\\S]{0,100}$"
        "extensions":
          "custom":
            "cfihosCode": "CFIHOS-10000087"
            "format": "Text, max 100 characters"
            "requirement": "Identifier"
      "numberOfMedia":
        "type": "INTEGER"
        "name": "numberOfMedia"
