            "requirement": "Mandatory"
      "propertyRelevantForEquipmentIndicator":
        "type": "BOOLEAN"
        "name": "propertyRelevantForEquipmentIndicator"
        "description": "An indicator whether the property should be provided for a given equipment. e.g. `Yes`. It is important to distinguish the properties that should be provided by the EPC for an equipment, but e.g. not for a model. For instance, the colour of a car is relevant for a given instance of a car, but not for the model."
