        "name": "propertyRelevantForModelPartIndicator"
        "description": "An indication whether the property must be provided by the EPC (or the manufacturer) for a given model. e.g. `Yes`. Some properties should be reported for the models / parts associated with an equipment class, some for the equipment associated with the equipment class. Those are two separate pieces of data."
